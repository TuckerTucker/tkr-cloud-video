name: Worker image

on:
  workflow_dispatch:
  push:
    branches: ["deploy/**"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The CUDA 12.8 base, the cu128 PyTorch backend, and the ComfyUI
      # dependency graph together exceed the runner's default free space.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the AMD64 worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          # GHCR rejects uppercase; github.repository preserves the owner's case.
          tags: |
            ghcr.io/tuckertucker/tkr-cloud-video:${{ github.sha }}
            ghcr.io/tuckertucker/tkr-cloud-video:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
