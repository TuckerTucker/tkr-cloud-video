  - number: 7
    feature: authorized-console-delivery
    delivers:
      - Signature Version 4 query presigning for one bucket in one reviewed Canadian region, computed
        from the standard library, GET only, incapable of creating, overwriting or deleting
      - A signing scope fixed at construction, so a request can vary the key and never the bucket
      - Satisfaction of the existing delivery signing port, so the one-hour policy cap sits above this
        and narrows it
    depends_on:
      - 1
    story_ids:
      - operator-console/story/play-back-a-committed-video
      - operator-console/story/keep-console-credentials-out-of-the-browser
    files:
      - src/tkr_cloud_video/console/presign.py
    data_lifecycle:
      kind: bounded
      detail: 'Issues a value with a lifetime rather than storing one. The link is response-only: it
        is returned to the caller that asked for it, is excluded from logs and error contexts by the
        existing forbidden-key rule, and expires on the delivery policy''s clock.'
    paths:
      - src/tkr_cloud_video/**
    title: Delivery presigner
    layer: service
    status: done
    evidence:
      kind: commit
      ref: 954dd8c54e68900805b6ed78cf039bdca11e3632
  - number: 8
    feature: authorized-console-delivery
    delivers:
      - A bounded read of one committed result marker over a short-lived presigned URL, so the process
        needs no second credential mechanism and no provider client
      - Absence returned as absence rather than as failure, because a job with nothing committed yet
        is a state
      - A ceiling on the readable body, so a wrong or redirected key cannot stream an unbounded response
        into the process
      - Failures reported without naming the URL, which is a secret for its lifetime
    depends_on:
      - 7
    story_ids:
