  - number: 9
    feature: authorized-console-delivery
    delivers:
      - Composition of the access policy, the signing service and the private result service, and of
        nothing on the write side, so uploading and deleting are absent rather than unused
      - The run's terminal status overlaid onto committed state, because the bucket cannot distinguish
        a failed attempt from one still sampling
      - The worker's reported job identity compared with the derived one, so a principal mismatch is
        named rather than presenting as a missing result
      - A model record of the surface with a verify command on every volatile claim
