capability: operator-console
slices:
  - number: 1
    feature: local-generation-console
    delivers:
      - Validated non-secret settings whose bind address is constrained to loopback in the settings
        rather than in the launch command
      - A credential value holding the Serverless bearer token and the delivery-read pair that renders
        none of them, refusing an empty secret at construction
      - The reviewed Canadian endpoint and region rule, extracted so the console and the existing storage
        adapter enforce one rule rather than two copies
    depends_on: []
    story_ids:
      - operator-console/story/submit-a-validated-generation
      - operator-console/story/keep-console-credentials-out-of-the-browser
    files:
      - src/tkr_cloud_video/console/settings.py
      - src/tkr_cloud_video/console/__init__.py
      - src/tkr_cloud_video/core/storage.py
    data_lifecycle:
      kind: exempt
      detail: 'Introduces no store. The console''s only state is a per-process registry of the jobs
        it derived this session, held in memory and lost on restart. That is deliberate: a durable
        registry would be a new record of job identities and request hashes with no retention clock,
        which is the gap already recorded against the fields this product does persist.'
    paths:
      - src/tkr_cloud_video/**
    title: Console settings and credential boundary
    layer: data
    status: done
    evidence:
      kind: commit
      ref: 954dd8c54e68900805b6ed78cf039bdca11e3632
