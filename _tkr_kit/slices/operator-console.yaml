  - number: 6
    feature: authorized-console-delivery
    delivers:
      - Job and attempt identity derived from the principal and the canonical request hash, mirroring
        the generation path so the console knows the result key before the worker has written it
      - A thread-safe session registry addressable by run identifier and by job identifier
      - An authorizer admitting only a job this console derived for its own principal, so an unknown
        job resolves exactly as an absent one
      - A repository reading the marker at the derived attempt key, requiring no listing and therefore
        no enumeration capability
    depends_on:
      - 1
