    feature: local-generation-console
    delivers:
      - Routing independent of any socket, so the whole surface is exercised as function calls and
        the server stays small enough to read in one sitting
      - A loopback server checking the Host header, keeping no access log, and serving one fixed content-security
        policy whose only permitted cross-origin load is the video
      - 'The page itself: model set, prompt form, dimensions, live preflight, wire text, envelope departure
        and run cards'
      - A console command beside doctor and serverless, and a launcher resolving the three secrets
        exactly as the existing scripts do
