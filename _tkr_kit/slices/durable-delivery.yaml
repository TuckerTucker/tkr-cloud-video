    story_ids:
      - retain-and-erase-prompt-evidence
    files:
      - src/tkr_cloud_video/delivery/prompt_retention.py
    paths:
      - src/tkr_cloud_video/delivery/prompt_retention.py
    data_lifecycle:
      kind: bounded
      detail: Prompt text expires on its declared period; the prompt digest survives
        because it is a non-reversible identity and is what makes a job
        reproducible after erasure. Bucket lifecycle rules cannot reach this
        field, which is why it needs a processor of its own rather than a
        prefix.
    title: Prompt-evidence retention processor
    layer: integration
    status: deferred
    description: "Deferred as unnecessary, not as postponed work. This slice assumed
      prompt text needed erasing on a clock of its own, which came from reading
      compliance-triage item 1 as requiring prompt deletion. Read against cl.
      4.5.3 the obligation is destruction once the identified purpose is
      fulfilled, under a documented procedure — not short-lived deletion. The
      prompt is the reproducibility record: prompting/render.py is built so two
      renders of one prompt are byte-identical, which is what makes the prompt
      digest a stable identity, so while the video exists the prompt is still
      required for an identified purpose. Prompt text is therefore retained for
      the life of the attempt and destroyed with it, which the slice 12
      reconciler does for free because generation.bin already shares the attempt
      prefix with video.bin. config/lifecycle.json records prompt-evidence at
      365 days so the position is documented rather than implicit. The erasure
      half of retain-and-erase-prompt-evidence survives in slice 14, where
      erasure is on request rather than on a clock."
