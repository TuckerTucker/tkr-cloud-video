      - src/tkr_cloud_video/security/credentials.py
      - docs/published/result-contract.md
      - tests/durable_delivery/test_retention_reconciler.py
    data_lifecycle:
      kind: bounded
      detail: This slice is the one that makes any period real. Until it lands every
        retention period in the project is a declaration with no enforcing
        mechanism. Committed deliverables and failed attempts share the outputs/
        prefix, and B2 applies the smallest non-null value among overlapping
        rules, so expressing both as prefix rules would delete deliverables at
        the failed-attempt period. Class separation is therefore decided by
        reading result.json, not by prefix. Erasure requires deleteFiles, which
        no existing credential role holds; the new role is control-plane only
        and must never enter a worker process allowlist.
    title: Retention reconciler and bucket lifecycle rules
    layer: integration
    status: done
    description: "Domain and integration logic complete and tested: rule projection,
      overlap refusal, drift detection, the reconciler, and the RETENTION_REAPER
      role. The concrete rclone RetentionStore and BucketRuleAdapter, plus the
      lifecycle CLI subcommand and scripts/provision_lifecycle_rules.sh, are
      composition and land with slice 15 rather than shipping here as a script
      pointing at a command that does not exist."
    evidence:
      kind: commit
      ref: 3e8820f
  - number: 13
    feature: enforced-retention
    delivers:
      - Erasure of expired prompt text from job evidence, preserving prompt
        digest, generation parameters and provenance
      - An explicit erased marker distinguishing an erased prompt from a job
        that never carried one
    depends_on:
