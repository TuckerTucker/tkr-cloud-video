    feature: authorized-reference-intake
    delivers:
      - A dated assessment record naming the scope reviewed, the sensitivity and
        purpose of reference images, the territories they are read in, and the
        protection measures that apply
      - A verdict, with any residual risk accepted and by whom, since a review
        recording no accepted risk either found none or did not look
      - An explicit statement of which measures are enforced and which are
        asserted, so the record does not read stronger than the system
