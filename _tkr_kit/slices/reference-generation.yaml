        renewal is a new dated file rather than an edit to an existing verdict.
    paths:
      - docs/assurance/**
    title: Cross-border reference-image assessment
    layer: data
    status: done
    description: 'This slice gates the upload path rather than documenting it, and
      slice 9 declares the dependency that makes the gate binding rather than
      stated. The provision requires the assessment before the communication
      outside Quebec, and ADR-002 already placed workers across six territories,
      so an upload path shipped ahead of this record would make an existing
      latent finding live. Slices 7 and 8 are deliberately not gated on it: a
      key-shape convention and a credential role read no reference image, and
      slice 9 is the first point at which one can arrive.'
    commits:
      - hash: ab8054f
        relation: implements
        message: "docs(assurance): assess cross-border processing of reference images"
        author: Tucker <34353433+TuckerTucker@users.noreply.github.com>
        files:
