    layer: service
    status: planned
  - number: 4
    feature: reference-conditioned-release
    delivers:
      - The reference model set selectable at intake, resolving its defaults
        from the registered envelope
      - A reference-to-video request reaching the binder with each staged input
        bound through its allowlisted source
      - The mode offered by the operator console's form, with its own dimensions
        and prompt sections
      - A binding refusal that names the input it could not find. Slice 1 found
        binding_input_missing raised at jobs/workflow_binder.py with no context,
        unlike every other error the module raises, so the refusal is correct
        and anonymous while the story's acceptance criterion requires it to name
        the missing input
      - A request supplying fewer than four references binding against the
        four-slot catalog. The binder refuses when a binding's request field is
        absent from the staged values and the stager emits input_0 through
        input_n-1, so a one-to-three reference request is refused today by the
        catalog slice 1 publishes; the request contract permits one to four, so
        the binder or the stager has to tolerate an unfilled slot
    depends_on:
      - 3
    story_ids:
