    delivers:
      - Whether the reference-conditioning node at the pinned ComfyUI revision
        accepts an audio input at all, read from its signature rather than
        assumed
      - If it does, the input names an audio reference binds through, so the
        existing input_0..input_3 allowlist can be checked against them
      - If it does not, the decision of record on whether audio needs a graph
        revision of its own and a second reviewer approval, since republishing
        changes the manifest digest the approval binds
    description: The blocker audio has that reference-conditioned-release exists to
      solve for images. The binder mutates only declared node inputs and refuses
      a binding whose input name is absent, so slices 12 to 15 can deliver a
      staged, verified audio reference and still have nothing to bind it into.
      Stills carries a facts-of-record slice for exactly this class of
      unverified model fact and audio carried none, which is what let the graph
      question stay unowned. This slice decides it before the contract work is
      spent.
