capability: reference-generation
slices:
  - number: 1
    feature: reference-conditioned-release
    delivers:
      - A ComfyUI API workflow whose reference-conditioning node inputs exist in
        the graph, because the binder mutates declared inputs and refuses a
        binding whose input name is absent
      - A binding map drawn from the existing input_0..input_3 allowlist,
        introducing no new binding source
      - The node signature read from the pinned ComfyUI revision, recorded
        beside the graph so the input names are re-checkable without trusting
        the prose
    depends_on: []
    story_ids:
      - reference-generation/story/publish-a-reference-conditioned-workflow
    files:
      - release-assets/minimax-h3-ref2v/workflow-api.json
      - release-assets/minimax-h3-ref2v/catalog.json
    data_lifecycle:
      kind: exempt
      detail: Introduces no store. The graph, binding map and envelope table are
        versioned in git and shipped in the pinned image; the published manifest
        is immutable and digest-addressed under the existing artifact layout.
    paths:
      - release-assets/**
      - tests/reference_generation/test_reference_workflow_graph.py
      - tests/reference_generation/__init__.py
    title: Reference-conditioned workflow graph
    layer: data
    status: done
