    data_lifecycle:
      kind: bounded
      detail: Local cache growth is capped by configured bytes/high-water mark; only
        whole unreferenced blobs are evicted. Partial files are deleted on
        checksum failure and by startup age sweep; all local cache content is
        disposable on worker destruction.
