capability: durable-delivery
stories:
  - name: allocate-immutable-result-attempt
    status: done
    display_name: Allocate immutable result attempt
    feature: verified-result-commit
    actor: Result service
    intent: assign an upload attempt namespace that cannot overwrite a completed
      result or mix concurrent retries
    preconditions:
      - The job and attempt identities are server-owned.
      - The output credential is restricted to the output namespace.
    trigger_action: A validated local result enters durable delivery
    steps:
      - actor: Result service
        action: resolves the job's commit state
        system_response: an existing completed result is returned and never reopened
      - actor: Result service
        action: allocates or resumes the documented attempt identity
        system_response: the remote prefix is unique and immutable after commit
      - actor: Result service
        action: records upload state without a completion marker
        system_response: consumers continue to observe in-progress
    acceptance_criteria:
      - given: a completed job is delivered again
        when: attempt allocation runs
        then: the existing committed result is returned without remote mutation
      - given: concurrent upload retries target the same job
        when: attempt allocation runs
        then: they converge safely or receive distinct attempts that cannot mix
          artifacts
    slice_ids:
      - durable-delivery/slice/1
      - durable-delivery/slice/4
      - durable-delivery/slice/5
  - name: upload-and-verify-all-result-artifacts
    status: done
    display_name: Upload and verify all result artifacts
    feature: verified-result-commit
    actor: Result uploader
    intent: transfer media and metadata and prove every required remote object
      matches before commit
    preconditions:
      - Local artifacts have validated roles, sizes, and SHA-256 digests.
      - The upload adapter can observe provider-supported remote size and
        checksum metadata.
    trigger_action: An immutable result attempt has an exact local result set
    steps:
      - actor: Result uploader
        action: uploads video, workflow, generation, and supporting metadata
        system_response: each destination is derived from the immutable attempt prefix
      - actor: Result uploader
        action: lists or heads every required remote object and compares size and
          supported checksum
        system_response: missing or mismatched objects keep the attempt uncommitted
      - actor: Result uploader
        action: records verified remote object identities and versions
        system_response: the commit builder has a complete evidence set
    acceptance_criteria:
      - given: video upload is absent or mismatched while metadata matches
        when: verification runs
        then: the attempt fails and result.json is not uploaded
      - given: all required artifacts match
        when: verification completes
        then: each result entry has local SHA-256, byte count, remote key, and immutable
          provider identity
    slice_ids:
      - durable-delivery/slice/2
      - durable-delivery/slice/4
      - durable-delivery/slice/5
  - name: publish-result-commit-marker-last
    status: done
    display_name: Publish result commit marker last
    feature: verified-result-commit
    actor: Result service
    intent: make completion consumer-visible only after the verified artifact set is
      durably described
    preconditions:
      - The result manifest passes its versioned schema.
      - The immutable attempt has no existing conflicting commit marker.
    trigger_action: Remote verification succeeds for every required artifact
    steps:
      - actor: Result service
        action: builds canonical result.json from verified evidence
        system_response: the manifest names job, attempt, workflow, model set,
          parameters, objects, sizes, digests, and versions
      - actor: Result service
        action: uploads result.json as the final object using idempotent conflict rules
        system_response: a matching retry succeeds and a different payload fails
      - actor: Result service
        action: marks the job completed
        system_response: consumers may now resolve the committed result
    acceptance_criteria:
      - given: any artifact verification is incomplete
        when: commit publication is requested
        then: publication is refused and consumers cannot observe completed
      - given: an identical commit upload is retried
        when: the result service compares canonical content
        then: the operation is idempotent without creating a divergent result
    slice_ids:
      - durable-delivery/slice/3
      - durable-delivery/slice/4
      - durable-delivery/slice/5
  - name: authorize-private-result-lookup
    status: done
    display_name: Authorize private result lookup
    feature: private-result-access-and-retention
    actor: Authorized application user
    intent: retrieve job state and committed result metadata without learning
      unauthorized job existence
    preconditions:
      - The application has authenticated the caller.
      - Job ownership or explicit access policy is available.
    trigger_action: The user requests a job result
    steps:
      - actor: Result API
        action: authorizes the caller before storage lookup details are exposed
        system_response: unauthorized requests receive a non-enumerating response
      - actor: Result API
        action: resolves job and commit state
        system_response: not-found, in-progress, failed, expired, and completed are
          mapped to stable domain outcomes
      - actor: Result API
        action: returns sanitized committed metadata
        system_response: storage credentials and internal provider errors remain hidden
    acceptance_criteria:
      - given: a caller lacks access to an existing job
        when: result lookup runs
        then: the response does not disclose job existence or metadata
      - given: an authorized completed job is requested
        when: lookup succeeds
        then: the response matches the committed result manifest and contains no storage
          credential
    slice_ids:
      - durable-delivery/slice/6
      - durable-delivery/slice/9
      - durable-delivery/slice/10
  - name: issue-short-lived-download-link
    status: done
    display_name: Issue short-lived download link
    feature: private-result-access-and-retention
    actor: Authorized application user
    intent: download a private committed video using a narrowly scoped expiring
      authorization
    preconditions:
      - The result manifest references an immutable verified video object.
      - The delivery service owns a read/share credential unavailable to workers
        and clients.
    trigger_action: The user requests download access to an authorized completed result
    steps:
      - actor: Delivery service
        action: rechecks authorization and result state
        system_response: expired or revoked access is rejected
      - actor: Delivery service
        action: creates a signed link with the shortest configured TTL
        system_response: the link is returned only to the authorized caller
      - actor: Telemetry layer
        action: records a redacted issuance event
        system_response: the URL token is never logged or persisted
    acceptance_criteria:
      - given: an authorization is revoked before link issuance
        when: the download request runs
        then: no signed link is created
      - given: a signed link exceeds its TTL
        when: the client attempts download
        then: the provider rejects access without exposing reusable credentials
    slice_ids:
      - durable-delivery/slice/7
      - durable-delivery/slice/9
      - durable-delivery/slice/10
  - name: enforce-object-lifecycle-policy
    status: done
    display_name: Enforce object lifecycle policy
    feature: private-result-access-and-retention
    actor: Platform operator
    intent: remove expired inputs, failed attempts, scratch outputs, hidden
      versions, and abandoned uploads while retaining selected deliverables
    preconditions:
      - Every object class has a retention purpose and period.
      - Committed deliverables are distinguishable from scratch and failed
        attempts.
    trigger_action: Lifecycle policy is provisioned, changed, or audited
    steps:
      - actor: Platform operator
        action: publishes prefix/object-class lifecycle rules
        system_response: the configuration is versioned and reviewable
      - actor: Lifecycle verifier
        action: tests representative timestamped fixtures and unfinished uploads
        system_response: expected expiration or preservation is observed
      - actor: Operator
        action: reviews lifecycle metrics and exceptions
        system_response: unexpected accumulation or deletion risk creates an actionable alert
    acceptance_criteria:
      - given: a failed attempt exceeds its retention period
        when: lifecycle processing runs
        then: attempt objects are deleted without affecting committed deliverables
      - given: a selected deliverable remains within its retention policy
        when: lifecycle processing runs
        then: the video and commit manifest remain available
    slice_ids:
      - durable-delivery/slice/8
      - durable-delivery/slice/9
      - durable-delivery/slice/10
  - name: provision-and-verify-bucket-lifecycle-rules
    status: planned
    display_name: Provision and verify bucket lifecycle rules
    feature: enforced-retention
    actor: Platform operator
    intent: have the declared retention periods actually applied to the bucket, and
      know immediately when what is declared and what is in force diverge
    preconditions:
      - config/lifecycle.yaml declares a period for every object class.
      - Objects are written under prefixes that distinguish input,
        failed-attempt, scratch, deliverable, hidden-version and multipart
        classes.
      - A credential with bucket-configuration capability is available and
        scoped to the one bucket.
    trigger_action: Lifecycle provisioning runs, or a drift check runs
    steps:
      - actor: Provisioner
        action: loads config/lifecycle.yaml and maps each object class to a prefix rule
        system_response: the declared policy version and the rule set it implies are
          reported before any write
      - actor: Provisioner
        action: applies the rule set to the bucket
        system_response: the bucket reports the rules now in force
      - actor: Drift check
        action: reads the rules in force and compares them to the declared policy
        system_response: an exact match passes; any divergence fails loudly and names
          the diverging class
    acceptance_criteria:
      - given: config/lifecycle.yaml declares input at 7 days
        when: provisioning runs against the bucket
        then: the bucket carries a rule deleting input-prefixed objects at 7 days
      - given: a rule is removed or altered on the bucket out of band
        when: the drift check runs
        then: it fails and names the class whose in-force rule no longer matches the
          declaration
      - given: an input object older than its period
        when: lifecycle processing has run
        then: the object is absent and committed deliverables under their period are
          untouched
  - name: retain-and-erase-prompt-evidence
    status: planned
    display_name: Retain and erase prompt evidence
    feature: enforced-retention
    actor: Platform operator
    intent: have caller-supplied prompt text expire on a declared period like every
      other personal field, rather than persist indefinitely because it is not
      an object-store object
    preconditions:
      - job.prompt and job.structured_prompt are request fields committed to job
        evidence, not objects under a lifecycle-managed prefix.
      - The prompt digest is a separate, non-reversible identity and is not
        itself personal information.
      - No existing ObjectClass covers prompt evidence.
    trigger_action: Prompt-evidence retention processing runs
    steps:
      - actor: Operator
        action: declares a retention period for prompt evidence alongside the object
          classes
        system_response: the period is versioned in the same policy that governs object classes
      - actor: Retention processor
        action: finds job evidence whose prompt exceeds the period
        system_response: prompt text is erased while the prompt digest, generation
          parameters and provenance evidence survive
      - actor: Operator
        action: audits a job whose prompt has expired
        system_response: the record is intact and reproducible by digest, and the prompt
          text is gone
    acceptance_criteria:
      - given: a job whose prompt exceeds its retention period
        when: retention processing runs
        then: job.prompt and job.structured_prompt are absent and the prompt digest
          remains
      - given: a job inside its retention period
        when: retention processing runs
        then: the prompt is untouched
      - given: a prompt has been erased
        when: the job record is read
        then: the erasure is explicit rather than indistinguishable from a job that
          never carried a prompt
  - name: serve-principal-access-and-erasure-request
    status: planned
    display_name: Serve a principal access and erasure request
    feature: enforced-retention
    actor: Calling principal
    intent: be told what personal information is held about me and have it erased on
      request, ahead of its scheduled expiry
    preconditions:
      - job.principal_id is the field a request resolves against and is held in
        the clear.
      - The job identity is a SHA-256 over principal and request digest, so
        records are not locatable from the digest alone.
      - Erasure must reach prompt, input reference and output video together to
        be meaningful.
    trigger_action: A principal submits an access or erasure request
    steps:
      - actor: Principal
        action: submits a request naming their principal id
        system_response: the requester is authorised as that principal before any record
          is disclosed
      - actor: Access path
        action: resolves every job held for that principal
        system_response: the existence, use and disclosure of their information is
          reported, including which fields are held and their scheduled expiry
      - actor: Principal
        action: requests erasure
        system_response: prompt text, input objects and output objects for those jobs
          are erased, and immutable release evidence is retained and identified
          as such
    acceptance_criteria:
      - given: an authorised principal with committed jobs
        when: they submit an access request
        then: they receive the held fields and scheduled expiry for every job of theirs
          and nothing belonging to another principal
      - given: an unauthorised caller naming another principal's id
        when: they submit an access request
        then: the request is refused without disclosing whether records exist
      - given: an authorised erasure request
        when: it completes
        then: prompt, input reference and output video are absent for those jobs and the
          erasure is recorded
