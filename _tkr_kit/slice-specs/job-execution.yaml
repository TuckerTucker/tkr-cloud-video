capability: job-execution
slice_specs:
  - name: validated-job-intake-1-spec
    title: Generation request contracts Specification
    status: approved
    format: full
    capability: job-execution
    feature: validated-job-intake
    slice: 1
    source_story_ids:
      - job-execution/story/validate-versioned-generation-request
    purpose: Implement Generation request contracts as the domain contract that
      discriminated t2v, i2v, and reference-to-video request models with bounded
      parameters and canonical serialization.
    layer_assignment:
      - component: GenerationRequestContractsPolicy
        layer: domain
        responsibility: Discriminated T2V, I2V, and reference-to-video request models
          with bounded parameters and canonical serialization
      - component: injected ports/adapters
        layer: integration
        responsibility: Provide filesystem, object storage, process, clock,
          authorization, media, and telemetry effects without coupling domain
          policy to providers
    interfaces:
      - name: GenerationRequestContractsPolicy
        kind: policy_or_domain_service
        signature: "async def execute(self, request: GenerationRequestContractsRequest,
          context: OperationContext) -> GenerationRequestContractsResult"
        async: true
        ownership: The feature composition root constructs the implementation and
          injects all side-effecting ports.
      - name: GenerationRequestContractsError
        kind: typed_error
        signature: "code: str; safe_message: str; retryable: bool; context: Mapping[str,
          str]"
        async: false
        ownership: Carries allowlisted diagnostic context only; cause chains are logged
          through structural redaction.
    data_models:
      - name: GenerationRequestContractsRequest
        shape: immutable Pydantic model
        fields: Only normalized identifiers, typed parameters, and already-authorized
          references required by this operation.
        validation: forbid unknown fields; reject control characters and unsafe paths at
          construction
      - name: GenerationRequestContractsResult
        shape: frozen dataclass or Pydantic model
        fields: Discriminated T2V, I2V, and reference-to-video request models with
          bounded parameters and canonical serialization,Server-owned JobId,
          AttemptId, IdempotencyKey, and typed validation errors
        validation: must be complete before return; no secret, signed URL token, full
          prompt, or user filename fields
      - name: OperationContext
        shape: frozen dataclass
        fields:
          - release_id
          - worker_id
          - correlation_id
          - job_id?
          - attempt_id?
          - deadline
        validation: safe identifiers only; cancellation/deadline propagated to every
          async adapter
    behavior:
      - story_id: job-execution/story/validate-versioned-generation-request
        given: a request contains an unsupported field, workflow, model set, or
          out-of-range parameter
        when: validation runs
        then: the response identifies all safe field errors and creates no job
      - story_id: job-execution/story/validate-versioned-generation-request
        given: a valid request is submitted
        when: normalization completes
        then: the stored canonical request and hash are deterministic
    error_handling:
      - condition: request_invalid
        error: JobValidationError
        recovery: Reject before download or GPU work and return safe field errors
        retryable: false
      - condition: authorization_denied
        error: JobAuthorizationError
        recovery: Return a non-enumerating denial and perform no storage read
        retryable: false
      - condition: idempotency_or_input_conflict
        error: JobConflictError
        recovery: Return the existing matching state or reject the conflicting payload
        retryable: false
    dependencies:
      required_slice_ids: []
      external:
        - Python standard library
        - pydantic
        - structlog
      inversion_of_control: All side effects are Protocol dependencies supplied by the
        capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - product configuration, security policy, and injected platform ports
      provides:
        - Discriminated T2V, I2V, and reference-to-video request models with
          bounded parameters and canonical serialization
        - Server-owned JobId, AttemptId, IdempotencyKey, and typed validation
          errors
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
      - name: SCHEMA_VERSION
        type: string
        default: "1"
        secret: false
        validation: supported version only
      - name: MAX_CONCURRENT_JOBS
        type: integer
        default: 1
        secret: false
        validation: ">= 1 and GPU/capacity checked"
      - name: JOB_TIMEOUT_SECONDS
        type: integer
        default: 3600
        secret: false
        validation: "> 0"
    observability:
      events:
        - job-execution.validated-job-intake.1.started
        - job-execution.validated-job-intake.1.succeeded
        - job-execution.validated-job-intake.1.failed
      required_fields:
        - event
        - release_id
        - worker_id
        - correlation_id
        - duration_ms
        - outcome
        - error_code?
        - job_id?
        - attempt_id?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
      logging_contract: Use structlog JSON. Emit state changes and adapter failures
        once at the owning boundary; preserve exception cause without
        serializing unsafe payloads.
    security_constraints:
      - Validate at the boundary and pass typed values inward; never rebuild
        paths from unchecked strings.
      - No global clients or ambient credentials; process and adapter roles
        receive the minimum dependency set.
      - Fail closed on identity, authorization, checksum, provenance, readiness,
        and commit uncertainty.
    test_scenarios:
      - id: S1-T01
        level: unit
        given: a request contains an unsupported field, workflow, model set, or
          out-of-range parameter
        when: validation runs
        then: the response identifies all safe field errors and creates no job
      - id: S1-T02
        level: unit
        given: a valid request is submitted
        when: normalization completes
        then: the stored canonical request and hash are deterministic
      - id: S1-TF
        level: failure_injection
        given: each declared error condition is injected at its adapter boundary
        when: Generation request contracts runs
        then: the recovery and retryability contract is observed and no forbidden
          completion or side effect occurs
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported
        return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability
        classification.
      - Structured events cover entry, success, failure, and material state
        transitions without sensitive fields.
      - Unit and adapter-contract tests pass; integration coverage exercises the
        linked stories.
      - No placeholder, TODO, mutable dependency reference, or console-only
        error remains.
    data_lifecycle:
      kind: bounded
      detail: Interactive job state and workspaces are ephemeral per worker and
        removed after durable completion or a configured failed-job debugging
        window. Idempotency records are retained only for the configured
        request-retry window; committed results remain discoverable through
        durable-delivery.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, and
        explicit exception wrapping with domain context.
      logging: structlog only for application events; provider output is captured,
        classified, and redacted.
      bash: Any entrypoint or helper remains Bash 3.2 compatible and delegates policy
        to typed Python code.
      testing: pytest parametrization for scenario tables; fakes implement the same
        Protocols as production adapters.
