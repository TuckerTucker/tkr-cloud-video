capability: security-foundation
slice_specs:
  - name: least-privilege-credentials-1-spec
    title: Credential boundary contracts Specification
    status: approved
    format: full
    capability: security-foundation
    feature: least-privilege-credentials
    slice: 1
    source_story_ids:
      - security-foundation/story/provision-single-prefix-storage-keys
    purpose: Implement Credential boundary contracts as the domain contract that
      typed credential roles, bucket/prefix scope, allowed capabilities, and
      forbidden-operation matrix.
    layer_assignment:
      - component: CredentialBoundaryContractsPolicy
        layer: domain
        responsibility: Typed credential roles, bucket/prefix scope, allowed
          capabilities, and forbidden-operation matrix
      - component: injected ports/adapters
        layer: integration
        responsibility: Provide filesystem, object storage, process, clock,
          authorization, media, and telemetry effects without coupling domain
          policy to providers
    interfaces:
      - name: CredentialBoundaryContractsPolicy
        kind: policy_or_domain_service
        signature: "async def execute(self, request: CredentialBoundaryContractsRequest,
          context: OperationContext) -> CredentialBoundaryContractsResult"
        async: true
        ownership: The feature composition root constructs the implementation and
          injects all side-effecting ports.
      - name: CredentialBoundaryContractsError
        kind: typed_error
        signature: "code: str; safe_message: str; retryable: bool; context: Mapping[str,
          str]"
        async: false
        ownership: Carries allowlisted diagnostic context only; cause chains are logged
          through structural redaction.
    data_models:
      - name: CredentialBoundaryContractsRequest
        shape: immutable Pydantic model
        fields: Only normalized identifiers, typed parameters, and already-authorized
          references required by this operation.
        validation: forbid unknown fields; reject control characters and unsafe paths at
          construction
      - name: CredentialBoundaryContractsResult
        shape: frozen dataclass or Pydantic model
        fields: Typed credential roles, bucket/prefix scope, allowed capabilities, and
          forbidden-operation matrix,Provider-neutral CredentialPolicy and
          CredentialProbe interfaces
        validation: must be complete before return; no secret, signed URL token, full
          prompt, or user filename fields
      - name: OperationContext
        shape: frozen dataclass
        fields:
          - release_id
          - worker_id
          - correlation_id
          - job_id?
          - attempt_id?
          - deadline
        validation: safe identifiers only; cancellation/deadline propagated to every
          async adapter
    behavior:
      - story_id: security-foundation/story/provision-single-prefix-storage-keys
        given: a declared credential boundary
        when: the operator provisions runtime keys
        then: each key has one bucket/prefix and only its required capabilities
      - story_id: security-foundation/story/provision-single-prefix-storage-keys
        given: a provisioned runtime key
        when: a forbidden prefix or operation is attempted
        then: access is denied and the safe test result is recorded
    error_handling:
      - condition: credential_scope_invalid
        error: CredentialScopeError
        recovery: Refuse provisioning or startup; report the role and requested boundary
          without key material
        retryable: false
      - condition: provider_capability_mismatch
        error: ProviderCapabilityMismatch
        recovery: Fail the probe and keep the credential inactive
        retryable: false
      - condition: secret_exposure_detected
        error: SecretExposureError
        recovery: Redact the value, fail the operation, and require rotation
        retryable: false
    dependencies:
      required_slice_ids: []
      external:
        - Python standard library
        - pydantic
        - structlog
      inversion_of_control: All side effects are Protocol dependencies supplied by the
        capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - product configuration, security policy, and injected platform ports
      provides:
        - Typed credential roles, bucket/prefix scope, allowed capabilities, and
          forbidden-operation matrix
        - Provider-neutral CredentialPolicy and CredentialProbe interfaces
      documented_routes: []
      reference_documentation:
        - https://www.backblaze.com/docs/en/cloud-storage-application-keys
        - https://rclone.org/b2/
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
      - name: SCHEMA_VERSION
        type: string
        default: "1"
        secret: false
        validation: supported version only
    observability:
      events:
        - security-foundation.least-privilege-credentials.1.started
        - security-foundation.least-privilege-credentials.1.succeeded
        - security-foundation.least-privilege-credentials.1.failed
      required_fields:
        - event
        - release_id
        - worker_id
        - correlation_id
        - duration_ms
        - outcome
        - error_code?
        - job_id?
        - attempt_id?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
      logging_contract: Use structlog JSON. Emit state changes and adapter failures
        once at the owning boundary; preserve exception cause without
        serializing unsafe payloads.
    security_constraints:
      - Validate at the boundary and pass typed values inward; never rebuild
        paths from unchecked strings.
      - No global clients or ambient credentials; process and adapter roles
        receive the minimum dependency set.
      - Fail closed on identity, authorization, checksum, provenance, readiness,
        and commit uncertainty.
    test_scenarios:
      - id: S1-T01
        level: unit
        given: a declared credential boundary
        when: the operator provisions runtime keys
        then: each key has one bucket/prefix and only its required capabilities
      - id: S1-T02
        level: unit
        given: a provisioned runtime key
        when: a forbidden prefix or operation is attempted
        then: access is denied and the safe test result is recorded
      - id: S1-TF
        level: failure_injection
        given: each declared error condition is injected at its adapter boundary
        when: Credential boundary contracts runs
        then: the recovery and retryability contract is observed and no forbidden
          completion or side effect occurs
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported
        return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability
        classification.
      - Structured events cover entry, success, failure, and material state
        transitions without sensitive fields.
      - Unit and adapter-contract tests pass; integration coverage exercises the
        linked stories.
      - No placeholder, TODO, mutable dependency reference, or console-only
        error remains.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, and
        explicit exception wrapping with domain context.
      logging: structlog only for application events; provider output is captured,
        classified, and redacted.
      bash: Any entrypoint or helper remains Bash 3.2 compatible and delegates policy
        to typed Python code.
      testing: pytest parametrization for scenario tables; fakes implement the same
        Protocols as production adapters.
    data_lifecycle:
      kind: bounded
      detail: Credential policy, capability-probe receipts, and rotation metadata are
        retained per environment. Secret values exist only in the provider
        secret store and allowlisted process memory, never in plans, logs,
        images, workflows, or artifacts. Superseded credentials are revoked and
        removed after replacement verification.
