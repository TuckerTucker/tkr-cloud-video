  - name: authorized-reference-intake-6-spec
    title: Cross-border reference-image assessment Specification
    status: planned
    format: full
    capability: reference-generation
    feature: authorized-reference-intake
    slice: 6
    source_story_ids:
      - reference-generation/story/assess-cross-border-reference-processing
    purpose: Record the assessment the provision requires before the processing it governs, not after.
      An uploaded reference image can depict an identifiable individual and the output is a moving
      likeness derived from it; worker placement already spans six territories, so enabling an intake
      path without this record would convert a noted finding into a live one.
    layer_assignment:
      - component: assurance record
        layer: data
        responsibility: A dated, scoped review reaching a verdict on reference-image processing
    interfaces:
      - name: assessment record
        kind: document
        signature: scope reviewed, sensitivity, purpose, territories, protection measures, verdict,
          residual risks accepted and by whom
        async: false
        ownership: Append-only. Renewal when territories or measures change is a new dated record,
          never an edit to a verdict.
    data_models:
      - name: assessment record
        shape: markdown document
        fields: Date; Scope; the personal information involved; the territories; the measures; the
          verdict; accepted residual risk
        validation: a verdict that is anything but a clean pass must name what was accepted and by
          whom; a review recording no accepted risk either found none or did not look
    behavior:
      - story_id: reference-generation/story/assess-cross-border-reference-processing
        given: no recorded assessment
        when: an intake path would be enabled
        then: the dependent slices stay blocked, because the assessment precedes the processing rather
          than describing it afterwards
      - story_id: reference-generation/story/assess-cross-border-reference-processing
        given: a recorded assessment
        when: territories or measures later change
        then: renewal is a new dated record rather than an edit to the existing verdict
      - story_id: reference-generation/story/assess-cross-border-reference-processing
        given: measures that are asserted rather than enforced
        when: the record is written
        then: it says which are which, so the record does not read stronger than the system
    error_handling:
      - condition: assessment_absent
        error: execution gate
        recovery: Keep the dependent slices blocked; this is the gate, not a document task
        retryable: false
      - condition: assessment_stale
        error: execution gate
        recovery: Require a new dated record when what it reviewed has changed
        retryable: false
    dependencies:
      required_slice_ids: []
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the deployed worker placement and its approved territories
        - the credential model and the declared retention position
      provides:
        - a recorded verdict on reference-image processing outside Quebec
      documented_routes: []
      reference_documentation:
        - The placement decision and its territories are recorded in the architecture decision record;
          the personal-information surface is recorded in the compliance triage record.
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - reference-generation.authorized-reference-intake.6.assessment_recorded
      required_fields:
        - event
        - outcome
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - The record names measures as enforced or asserted, matching how the triage record already distinguishes
        the one field whose safeguard is enforced from those that are declared.
      - No reference image is staged for a worker read before this record exists and is accepted.
    test_scenarios:
      - id: S6-T01
        level: review
        given: the drafted record
        when: it is reviewed
        then: it names scope, sensitivity, purpose, territories, measures and a verdict
      - id: S6-T02
        level: review
        given: a qualified verdict
        when: it is reviewed
        then: the residual risk and its acceptor are named
      - id: S6-T03
        level: review
        given: a later change of territory or measure
        when: renewal is considered
        then: a new dated record is produced
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - The verdict is a human's; the evidence may be gathered but the acceptance is signed.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: exempt
      detail: Introduces no store. The record is an append-only assurance document; renewal is a new
        dated file rather than an edit to an existing verdict.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
