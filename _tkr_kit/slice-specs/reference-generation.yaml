  - name: authorized-reference-intake-7-spec
    title: Principal-scoped input namespace Specification
    status: planned
    format: full
    capability: reference-generation
    feature: authorized-reference-intake
    slice: 7
    source_story_ids:
      - reference-generation/story/refuse-a-reference-a-principal-does-not-own
      - reference-generation/story/supply-one-to-four-reference-images
    purpose: Make input authorization derived rather than looked up. If an input's key carries the
      principal that owns it, authorization is a property of the key and no table can disagree with
      it, which is the same reasoning that already makes job identity a digest over the principal rather
      than a stored association.
    layer_assignment:
      - component: input namespace
        layer: domain
        responsibility: An inputs prefix scoped by principal
      - component: InputSource.authorized
        layer: domain
        responsibility: Derive ownership from the key rather than consult a table
    interfaces:
      - name: input key grammar
        kind: domain_function
        signature: 'def input_namespace(principal_id: str) -> str'
        async: false
        ownership: Returns the one namespace a principal may read and write; a key outside it is another
          principal's.
      - name: InputSource.authorized
        kind: port_method
        signature: 'async def authorized(self, principal_id: str, key: ObjectKey) -> bool'
        async: true
        ownership: Reused unchanged as a port; this slice changes what makes it true, not its shape.
    data_models:
      - name: scoped input key
        shape: validated value object
        fields: the inputs prefix, the principal segment, then a server-owned object name
        validation: the principal segment cannot be spoofed by a crafted key; separators, traversal
          and control characters are refused by the existing key validation
    behavior:
      - story_id: reference-generation/story/refuse-a-reference-a-principal-does-not-own
        given: a key in another principal's namespace
        when: staging runs
        then: it is refused before any download, so no bytes are transferred
      - story_id: reference-generation/story/refuse-a-reference-a-principal-does-not-own
        given: an unauthorized key and an absent object
        when: each is requested
        then: the answers are indistinguishable
      - story_id: reference-generation/story/supply-one-to-four-reference-images
        given: a key in the caller's own namespace
        when: staging runs
        then: it is authorized and downloaded within its bound
    error_handling:
      - condition: input_unauthorized
        error: InputStagingError
        recovery: Refuse before download; give the same answer as absence
        retryable: false
      - condition: input_key_malformed
        error: BoundaryValidationError
        recovery: Refuse a key that could escape its namespace
        retryable: false
    dependencies:
      required_slice_ids: []
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the existing input staging port and key validation
      provides:
        - structural ownership of an input object
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - reference-generation.authorized-reference-intake.7.started
        - reference-generation.authorized-reference-intake.7.succeeded
        - reference-generation.authorized-reference-intake.7.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - Authorization is derived from the key, so an input cannot be reached by guessing another principal's
        object name.
      - Refusal and absence are one outcome, so the namespace cannot be probed.
    test_scenarios:
      - id: S7-T01
        level: unit
        given: a key in another principal's namespace
        when: staging runs
        then: it is refused before download
      - id: S7-T02
        level: unit
        given: an unauthorized key and an absent object
        when: both are requested
        then: the outcomes are equal
      - id: S7-T03
        level: unit
        given: a key with traversal or control syntax
        when: it is validated
        then: it is refused
      - id: S7-TF
        level: failure_injection
        given: a crafted key imitating a principal segment
        when: it is validated
        then: it is refused
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: bounded
      detail: Creates objects under the inputs prefix, which already carries a declared retention class
        and a bucket lifecycle rule. Enforcing that period belongs to the enforced-retention feature;
        what must not happen here is creating input objects outside the prefix those rules reach.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
  - name: authorized-reference-intake-8-spec
    title: Input-writing credential role Specification
    status: planned
    format: full
    capability: reference-generation
    feature: authorized-reference-intake
    slice: 8
    source_story_ids:
      - reference-generation/story/refuse-a-reference-a-principal-does-not-own
    purpose: 'Model the credential that puts an image into the input namespace, because today none
      exists: the input role holds list and read only, and the request contract takes a key that must
      already exist. Writing inputs is therefore out of band and unmodelled, and this slice either
      models it narrowly or records the decision to keep it out of band.'
    layer_assignment:
      - component: CredentialRole.INPUT_WRITER
        layer: service
        responsibility: List and write on the principal-scoped inputs namespace only
      - component: process secret allowlist
        layer: integration
        responsibility: Absent from every worker process role
    interfaces:
      - name: ROLE_CAPABILITIES
        kind: registry
        signature: role to storage capability set
        async: false
        ownership: The new role holds list and write, never delete and never share, so it cannot remove
          or publish what it wrote.
      - name: SECRET_VARIABLES
        kind: registry
        signature: process role to permitted secret variables
        async: false
        ownership: The input-writing variables appear in no worker process role, so no worker subprocess
          can be handed a credential that writes inputs.
    data_models:
      - name: input-writer credential
        shape: provisioned application key
        fields: one bucket, one prefix, list and write capabilities
        validation: single-prefix, matching the existing topology in which every credential maps to
          exactly one namespace
    behavior:
      - story_id: reference-generation/story/refuse-a-reference-a-principal-does-not-own
        given: the input-writing credential
        when: its capabilities are inspected
        then: it can write the inputs namespace and nothing else, and holds neither delete nor share
      - story_id: reference-generation/story/refuse-a-reference-a-principal-does-not-own
        given: every worker process role
        when: its secret allowlist is inspected
        then: the input-writing variables are absent from all of them
    error_handling:
      - condition: role_capability_widened
        error: test failure
        recovery: Fail the least-privilege contract rather than ship a broader key
        retryable: false
      - condition: worker_granted_input_write
        error: test failure
        recovery: Fail; a worker that can write inputs can rewrite its own conditioning
        retryable: false
    dependencies:
      required_slice_ids:
        - 7
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the existing credential topology and process secret isolation
      provides:
        - a narrow credential able to create an input object
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - reference-generation.authorized-reference-intake.8.started
        - reference-generation.authorized-reference-intake.8.succeeded
        - reference-generation.authorized-reference-intake.8.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - The role holds neither delete nor share, so it can neither remove what it wrote nor issue a
        link to it.
      - It is a control-plane or console credential, never a worker one.
    test_scenarios:
      - id: S8-T01
        level: unit
        given: the new role
        when: its capabilities are read
        then: list and write only, on one prefix
      - id: S8-T02
        level: unit
        given: every worker process role
        when: its allowlist is read
        then: the input-writing variables are absent
      - id: S8-T03
        level: unit
        given: a write outside the namespace
        when: it is attempted
        then: the credential cannot reach it
      - id: S8-TF
        level: failure_injection
        given: a role definition widened in place
        when: the contract test runs
        then: it fails
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - If the decision is to keep staging out of band, this slice closes as deferred with that decision
        recorded and slice 9 accepts an existing key instead.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: bounded
      detail: Creates objects under the inputs prefix, which already carries a declared retention class
        and a bucket lifecycle rule. Enforcing that period belongs to the enforced-retention feature;
        what must not happen here is creating input objects outside the prefix those rules reach.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
  - name: authorized-reference-intake-9-spec
    title: Wire Authorized Reference Intake Specification
    status: planned
    format: full
    capability: reference-generation
    feature: authorized-reference-intake
    slice: 9
    source_story_ids:
      - reference-generation/story/supply-one-to-four-reference-images
    purpose: Give the operator a way to supply references, and be explicit that doing so widens what
      the console is. Until now it composes no write path at all, and that absence is a tested property
      recorded as one of its constraints; this slice changes it, so it changes the record too rather
      than quietly invalidating it.
    layer_assignment:
      - component: console upload path
        layer: integration
        responsibility: Accept references, bounded at four, and place them in the namespace
      - component: console routes
        layer: integration
        responsibility: The reference routes and their refusals
      - component: model record
        layer: integration
        responsibility: The surface's constraints, updated where the write capability is added
    interfaces:
      - name: upload route
        kind: api_route
        signature: POST /api/inputs -> {object_key, sha256}
        async: true
        ownership: Returns the key the caller then names in a request, so the request contract is unchanged.
      - name: reference form
        kind: ui_surface
        signature: up to four references with their refusals by field and rule
        async: false
        ownership: Bounded at four in the surface as well as the contract, so the limit is visible
          before submission.
    data_models:
      - name: staged reference response
        shape: serialized mapping
        fields: 'object_key: str; sha256: str'
        validation: returns the server-owned key and the computed digest, so the caller names neither
    behavior:
      - story_id: reference-generation/story/supply-one-to-four-reference-images
        given: a supplied reference
        when: it is uploaded
        then: it lands in the caller's own namespace under a server-owned name
      - story_id: reference-generation/story/supply-one-to-four-reference-images
        given: five references
        when: they are supplied
        then: the fifth is refused before submission
      - story_id: reference-generation/story/supply-one-to-four-reference-images
        given: an uploaded reference
        when: a generation is submitted
        then: each staged reference binds into the published graph
    error_handling:
      - condition: input_write_failed
        error: AppError
        recovery: Report as an error document; the page renders every failure the same way
        retryable: true
      - condition: too_many_references
        error: Rejection
        recovery: Refuse at the surface as well as the contract
        retryable: false
    dependencies:
      required_slice_ids:
        - 5
        - 8
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the input-writing credential
        - the published reference release
      provides:
        - a reference supplied and generated from through the console
      documented_routes:
        - POST /api/inputs
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - reference-generation.authorized-reference-intake.9.started
        - reference-generation.authorized-reference-intake.9.succeeded
        - reference-generation.authorized-reference-intake.9.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - The console gains a write capability it previously did not have; the model record states that
        plainly rather than leaving a stale claim that it composes no write path.
      - Uploaded objects are named by the server, so a caller-supplied filename never becomes a key.
