capability: reference-generation
slice_specs:
  - name: reference-conditioned-release-1-spec
    title: Reference-conditioned workflow graph Specification
    status: planned
    format: full
    capability: reference-generation
    feature: reference-conditioned-release
    slice: 1
    source_story_ids:
      - reference-generation/story/publish-a-reference-conditioned-workflow
    purpose: Give a staged reference somewhere to bind. The binder mutates only declared node inputs
      and refuses a binding whose input name is absent from the pinned graph, so an image cannot be
      bound into a node that has no image input. The currently published graph drives the image-conditioning
      node with nothing attached, which is what text-to-video is on this model set; this slice publishes
      a graph where the reference inputs exist.
    layer_assignment:
      - component: reference workflow graph
        layer: data
        responsibility: A ComfyUI API workflow whose reference inputs are declared
      - component: binding map
        layer: data
        responsibility: Request sources mapped to exact node inputs, drawn from the existing allowlist
    interfaces:
      - name: workflow-api.json
        kind: artifact
        signature: ComfyUI API-format graph including reference loader nodes feeding the conditioning
          node
        async: false
        ownership: Immutable once published and addressed by digest; a change is a new revision, never
          an edit.
      - name: catalog.json workflow.bindings
        kind: artifact
        signature: list of {source, node_id, input_name} entries
        async: false
        ownership: Each source must be a member of the release binding allowlist, which already carries
          exactly four input slots, matching the contract's maximum of four references.
    data_models:
      - name: WorkflowBinding
        shape: existing release model
        fields: source; node_id; input_name
        validation: source is validated against the allowlist; node identifiers reject path and control
          syntax
    behavior:
      - story_id: reference-generation/story/publish-a-reference-conditioned-workflow
        given: a graph whose reference input is absent
        when: a reference request is bound
        then: binding fails naming the missing input, rather than generating without the reference
      - story_id: reference-generation/story/publish-a-reference-conditioned-workflow
        given: a binding map naming a source outside the allowlist
        when: the manifest is rendered
        then: publication fails, because the binding vocabulary is release-approved rather than free
      - story_id: reference-generation/story/publish-a-reference-conditioned-workflow
        given: the pinned ComfyUI revision
        when: the node signature is read
        then: the declared input names are recorded beside the graph so a reader can re-check them
    error_handling:
      - condition: binding_input_missing
        error: WorkflowBindingError
        recovery: Fail before prompt submission; a graph that cannot receive a reference must not run
          as though it had
        retryable: false
      - condition: binding_source_not_allowlisted
        error: ValidationError
        recovery: Refuse the catalog at render time
        retryable: false
    dependencies:
      required_slice_ids: []
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the pinned ComfyUI revision's node signature
        - the existing binding allowlist
      provides:
        - a graph a reference request can bind into
        - a release-approved binding map
      documented_routes: []
      reference_documentation:
        - The pinned ComfyUI revision is recorded in the worker image build arguments; read the node
          signature there rather than restating it here.
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - reference-generation.reference-conditioned-release.1.started
        - reference-generation.reference-conditioned-release.1.succeeded
        - reference-generation.reference-conditioned-release.1.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - The graph is immutable and digest-addressed; a revision is published, never edited in place.
      - No new binding source is introduced, so the release binding vocabulary is unchanged.
    test_scenarios:
      - id: S1-T01
        level: unit
        given: a graph missing the reference input
        when: a reference request is bound
        then: binding fails naming the input
      - id: S1-T02
        level: unit
        given: four references and four declared inputs
        when: binding runs
        then: each reaches its declared node input
      - id: S1-T03
        level: unit
        given: a binding source outside the allowlist
        when: the catalog is validated
        then: it is refused
      - id: S1-TF
        level: failure_injection
        given: a graph whose digest does not match the manifest
        when: binding runs
        then: it is refused before submission
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: exempt
      detail: Introduces no store. The graph, binding map and envelope table are versioned in git and
        shipped in the pinned image; the published manifest is immutable and digest-addressed under
        the existing artifact layout.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
  - name: reference-conditioned-release-2-spec
    title: Reference model-set envelope Specification
    status: planned
    format: full
    capability: reference-generation
    feature: reference-conditioned-release
    slice: 2
    source_story_ids:
      - reference-generation/story/register-the-reference-model-set-envelope
    purpose: Let a reference request resolve its own dimensions. Envelopes are keyed by model-set identity
      precisely so a second model set cannot inherit the first one's numbers, and an unregistered model
      set is refused rather than guessed at, so a reference model set is unusable until it is registered
      here.
    layer_assignment:
      - component: TrainedRange entry
        layer: data
        responsibility: The canvas and frame range the reference model set was trained on
      - component: envelope digest
        layer: data
        responsibility: Restated with the table, verified at import
    interfaces:
      - name: TRAINED_RANGES
        kind: registry
        signature: mapping of model-set identity to TrainedRange
        async: false
        ownership: 'Keyed on the full identifier deliberately: a rebuild mints a new identifier and
          someone has to affirm the envelope still holds rather than inherit it by prefix.'
      - name: ENVELOPE_DIGEST
        kind: integrity_constant
        signature: the digest the tables must reproduce at import
        async: false
        ownership: Restating it is the act that records a deliberate change to where default requests
          land.
    data_models:
      - name: TrainedRange
        shape: existing frozen dataclass
        fields: model_set_id; short_edge; long_edge; min_frames; max_frames; grid_stride; grid_offset;
          canvas_multiple; source
        validation: construction rejects an envelope that cannot describe a reachable request
    behavior:
      - story_id: reference-generation/story/register-the-reference-model-set-envelope
        given: a reference request naming an unregistered model set
        when: intake runs
        then: it is refused naming the model set rather than given another model set's numbers
      - story_id: reference-generation/story/register-the-reference-model-set-envelope
        given: an edited range with the digest unchanged
        when: the tables load
        then: the import fails, because the recorded revision would no longer describe where defaults
          land
      - story_id: reference-generation/story/register-the-reference-model-set-envelope
        given: a reference request below the trained floor
        when: intake runs
        then: it is permitted and reported as a departure, matching the existing rule that the ceiling
          bounds and the floor reports
    error_handling:
      - condition: no_registered_envelope
        error: ValueError
        recovery: Refuse the request; a guessed default would misdescribe the run
        retryable: false
      - condition: envelope_digest_mismatch
        error: TrainedEnvelopeIntegrityError
        recovery: Fail at import rather than serve a silently changed default
        retryable: false
    dependencies:
      required_slice_ids: []
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the pinned envelope registry
      provides:
        - default resolution for reference requests
        - bounds enforcement for the reference model set
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - reference-generation.reference-conditioned-release.2.started
        - reference-generation.reference-conditioned-release.2.succeeded
        - reference-generation.reference-conditioned-release.2.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - The model-set identity decision is recorded, since the currently published identity names text-to-video
        while shipping the keyframe checkpoint.
    test_scenarios:
      - id: S2-T01
        level: unit
        given: an unregistered model set
        when: intake runs
        then: the request is refused naming it
      - id: S2-T02
        level: unit
        given: a registered reference model set with no dimensions given
        when: intake runs
        then: its trained dimensions are filled
      - id: S2-T03
        level: unit
        given: an edited table with a stale digest
        when: the module is imported
        then: the import fails
      - id: S2-TF
        level: failure_injection
        given: a canvas off the multiple and frames off the grid
        when: intake runs
        then: each is refused naming its own rule
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: exempt
      detail: Introduces no store. The graph, binding map and envelope table are versioned in git and
        shipped in the pinned image; the published manifest is immutable and digest-addressed under
        the existing artifact layout.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
  - name: reference-conditioned-release-3-spec
    title: Reference release approval and publication Specification
    status: planned
    format: full
    capability: reference-generation
    feature: reference-conditioned-release
    slice: 3
    source_story_ids:
      - reference-generation/story/publish-a-reference-conditioned-workflow
    purpose: Publish the reference release under an approval that actually covers it. The reviewer
      approval binds a manifest digest, and republishing a workflow changes that digest, so a reference
      release without a re-signature is a release the gate must refuse. This slice exists because that
      consequence is easy to discover late and expensive to discover at run time.
    layer_assignment:
      - component: release manifest
        layer: data
        responsibility: The rendered manifest for the reference catalog
      - component: license approval
        layer: data
        responsibility: A reviewer approval bound to the new manifest digest
      - component: publication path
        layer: service
        responsibility: The existing publish flow, workflow last
    interfaces:
      - name: prepare/publish release
        kind: service
        signature: the existing release commands, given the reference catalog and approval identifier
        async: false
        ownership: Publishes the workflow last, so the release resolves only after every artifact it
          needs verifies.
      - name: release gate
        kind: service
        signature: compares approval model set and manifest digest against the rendered manifest
        async: false
        ownership: Reused unchanged; the gate is what makes an uncovered digest a publication failure
          rather than a run-time surprise.
    data_models:
      - name: license approval
        shape: existing model
        fields: approval_id; reviewer_id; model_set_id; manifest_digest; deployment_use; territories;
          approved_at; expires_at; constraints
        validation: the digest must equal the rendered manifest's; territory and expiry are carried
          forward rather than widened
    behavior:
      - story_id: reference-generation/story/publish-a-reference-conditioned-workflow
        given: a republished workflow
        when: the manifest digest is computed
        then: it differs from the current one, so the existing approval no longer covers it
      - story_id: reference-generation/story/publish-a-reference-conditioned-workflow
        given: an approval bound to a different digest
        when: publication runs
        then: the gate refuses, rather than the mismatch surfacing when a worker executes
      - story_id: reference-generation/story/publish-a-reference-conditioned-workflow
        given: an expired approval
        when: publication runs
        then: it is refused
    error_handling:
      - condition: approval_digest_mismatch
        error: release gate failure
        recovery: Refuse publication and require a reviewer re-signature
        retryable: false
      - condition: approval_expired
        error: release gate failure
        recovery: Refuse; an expired approval is not a weaker approval
        retryable: false
    dependencies:
      required_slice_ids:
        - 1
        - 2
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the reference catalog
        - a reviewer license approval
      provides:
        - a published, digest-addressed reference release
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - reference-generation.reference-conditioned-release.3.started
        - reference-generation.reference-conditioned-release.3.succeeded
        - reference-generation.reference-conditioned-release.3.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - Territory and deployment use are carried forward from the existing approval, never widened
        as a side effect of a workflow change.
      - The approval is human-signed; nothing in this slice may mint one.
    test_scenarios:
      - id: S3-T01
        level: unit
        given: a manifest digest not matching the approval
        when: the gate runs
        then: publication is refused
      - id: S3-T02
        level: unit
        given: an expired approval
        when: the gate runs
        then: publication is refused
      - id: S3-T03
        level: integration
        given: a valid approval and catalog
        when: publication runs
        then: the workflow is published last
      - id: S3-TF
        level: failure_injection
        given: a partial publication
        when: it is retried
        then: no consumer-visible release exists for an unverified artifact set
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: exempt
      detail: Introduces no store. The graph, binding map and envelope table are versioned in git and
        shipped in the pinned image; the published manifest is immutable and digest-addressed under
        the existing artifact layout.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
