    test_scenarios:
      - id: S9-T01
        level: integration
        given: one reference
        when: it is uploaded and a generation submitted
        then: it binds and the run reaches a committed result
      - id: S9-T02
        level: integration
        given: five references
        when: they are supplied
        then: the surface refuses before submission
      - id: S9-T03
        level: integration
        given: a caller-supplied filename
        when: an upload runs
        then: the stored key is server-owned
      - id: S9-TF
        level: failure_injection
        given: a write failure
        when: an upload runs
        then: it renders as an error document
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
