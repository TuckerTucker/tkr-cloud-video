capability: durable-delivery
slice_specs:
  - name: verified-result-commit-1-spec
    title: Result commit contracts Specification
    status: approved
    format: full
    capability: durable-delivery
    feature: verified-result-commit
    slice: 1
    source_story_ids:
      - durable-delivery/story/allocate-immutable-result-attempt
    purpose: Implement Result commit contracts as the domain contract that versioned
      result manifest, artifact evidence, upload attempt, and commit-state
      models.
    layer_assignment:
      - component: ResultCommitContractsPolicy
        layer: domain
        responsibility: Versioned result manifest, artifact evidence, upload attempt,
          and commit-state models
      - component: injected ports/adapters
        layer: integration
        responsibility: Provide filesystem, object storage, process, clock,
          authorization, media, and telemetry effects without coupling domain
          policy to providers
    interfaces:
      - name: ResultCommitContractsPolicy
        kind: policy_or_domain_service
        signature: "async def execute(self, request: ResultCommitContractsRequest,
          context: OperationContext) -> ResultCommitContractsResult"
        async: true
        ownership: The feature composition root constructs the implementation and
          injects all side-effecting ports.
      - name: ResultCommitContractsError
        kind: typed_error
        signature: "code: str; safe_message: str; retryable: bool; context: Mapping[str,
          str]"
        async: false
        ownership: Carries allowlisted diagnostic context only; cause chains are logged
          through structural redaction.
    data_models:
      - name: ResultCommitContractsRequest
        shape: immutable Pydantic model
        fields: Only normalized identifiers, typed parameters, and already-authorized
          references required by this operation.
        validation: forbid unknown fields; reject control characters and unsafe paths at
          construction
      - name: ResultCommitContractsResult
        shape: frozen dataclass or Pydantic model
        fields: Versioned result manifest, artifact evidence, upload attempt, and
          commit-state models,Canonical serialization and idempotent
          matching/conflict rules
        validation: must be complete before return; no secret, signed URL token, full
          prompt, or user filename fields
      - name: OperationContext
        shape: frozen dataclass
        fields:
          - release_id
          - worker_id
          - correlation_id
          - job_id?
          - attempt_id?
          - deadline
        validation: safe identifiers only; cancellation/deadline propagated to every
          async adapter
    behavior:
      - story_id: durable-delivery/story/allocate-immutable-result-attempt
        given: a completed job is delivered again
        when: attempt allocation runs
        then: the existing committed result is returned without remote mutation
      - story_id: durable-delivery/story/allocate-immutable-result-attempt
        given: concurrent upload retries target the same job
        when: attempt allocation runs
        then: they converge safely or receive distinct attempts that cannot mix
          artifacts
    error_handling:
      - condition: upload_failed
        error: ArtifactUploadError
        recovery: Retry within the immutable attempt; never publish completion
        retryable: true
      - condition: remote_mismatch
        error: RemoteVerificationError
        recovery: Mark the attempt failed and preserve evidence for bounded diagnostics
        retryable: false
      - condition: commit_conflict_or_incomplete
        error: ResultCommitError
        recovery: Refuse mutation and return the existing matching commit or a conflict
        retryable: false
    dependencies:
      required_slice_ids: []
      external:
        - Python standard library
        - pydantic
        - structlog
      inversion_of_control: All side effects are Protocol dependencies supplied by the
        capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - product configuration, security policy, and injected platform ports
      provides:
        - Versioned result manifest, artifact evidence, upload attempt, and
          commit-state models
        - Canonical serialization and idempotent matching/conflict rules
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
      - name: SCHEMA_VERSION
        type: string
        default: "1"
        secret: false
        validation: supported version only
    observability:
      events:
        - durable-delivery.verified-result-commit.1.started
        - durable-delivery.verified-result-commit.1.succeeded
        - durable-delivery.verified-result-commit.1.failed
      required_fields:
        - event
        - release_id
        - worker_id
        - correlation_id
        - duration_ms
        - outcome
        - error_code?
        - job_id?
        - attempt_id?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
      logging_contract: Use structlog JSON. Emit state changes and adapter failures
        once at the owning boundary; preserve exception cause without
        serializing unsafe payloads.
    security_constraints:
      - Validate at the boundary and pass typed values inward; never rebuild
        paths from unchecked strings.
      - No global clients or ambient credentials; process and adapter roles
        receive the minimum dependency set.
      - Fail closed on identity, authorization, checksum, provenance, readiness,
        and commit uncertainty.
    test_scenarios:
      - id: S1-T01
        level: unit
        given: a completed job is delivered again
        when: attempt allocation runs
        then: the existing committed result is returned without remote mutation
      - id: S1-T02
        level: unit
        given: concurrent upload retries target the same job
        when: attempt allocation runs
        then: they converge safely or receive distinct attempts that cannot mix
          artifacts
      - id: S1-TF
        level: failure_injection
        given: each declared error condition is injected at its adapter boundary
        when: Result commit contracts runs
        then: the recovery and retryability contract is observed and no forbidden
          completion or side effect occurs
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported
        return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability
        classification.
      - Structured events cover entry, success, failure, and material state
        transitions without sensitive fields.
      - Unit and adapter-contract tests pass; integration coverage exercises the
        linked stories.
      - No placeholder, TODO, mutable dependency reference, or console-only
        error remains.
    data_lifecycle:
      kind: bounded
      detail: Uncommitted upload attempts expire after the retry/debug window;
        committed result manifests and selected deliverables follow product
        retention. Abandoned multipart uploads and hidden versions are
        explicitly expired.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, and
        explicit exception wrapping with domain context.
      logging: structlog only for application events; provider output is captured,
        classified, and redacted.
      bash: Any entrypoint or helper remains Bash 3.2 compatible and delegates policy
        to typed Python code.
      testing: pytest parametrization for scenario tables; fakes implement the same
        Protocols as production adapters.
