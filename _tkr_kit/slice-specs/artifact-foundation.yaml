capability: artifact-foundation
slice_specs:
  - name: immutable-artifact-catalog-1-spec
    title: Artifact catalog contracts Specification
    status: approved
    format: full
    capability: artifact-foundation
    feature: immutable-artifact-catalog
    slice: 1
    source_story_ids:
      - artifact-foundation/story/publish-content-addressed-model-blobs
    purpose: Implement Artifact catalog contracts as the data contract that
      versioned model-set manifest, artifact entry, workflow identity,
      provenance, and publication receipt models.
    layer_assignment:
      - component: ArtifactCatalogContractsPort
        layer: data
        responsibility: Versioned model-set manifest, artifact entry, workflow identity,
          provenance, and publication receipt models
      - component: injected ports/adapters
        layer: integration
        responsibility: Provide filesystem, object storage, process, clock,
          authorization, media, and telemetry effects without coupling domain
          policy to providers
    interfaces:
      - name: ArtifactCatalogContractsPort
        kind: schema_or_repository_port
        signature: "async def execute(self, request: ArtifactCatalogContractsRequest,
          context: OperationContext) -> ArtifactCatalogContractsResult"
        async: true
        ownership: The feature composition root constructs the implementation and
          injects all side-effecting ports.
      - name: ArtifactCatalogContractsError
        kind: typed_error
        signature: "code: str; safe_message: str; retryable: bool; context: Mapping[str,
          str]"
        async: false
        ownership: Carries allowlisted diagnostic context only; cause chains are logged
          through structural redaction.
    data_models:
      - name: ArtifactCatalogContractsRequest
        shape: immutable Pydantic model
        fields: Only normalized identifiers, typed parameters, and already-authorized
          references required by this operation.
        validation: forbid unknown fields; reject control characters and unsafe paths at
          construction
      - name: ArtifactCatalogContractsResult
        shape: frozen dataclass or Pydantic model
        fields: Versioned model-set manifest, artifact entry, workflow identity,
          provenance, and publication receipt models,Canonical JSON
          serialization and schema fixtures
        validation: must be complete before return; no secret, signed URL token, full
          prompt, or user filename fields
      - name: OperationContext
        shape: frozen dataclass
        fields:
          - release_id
          - worker_id
          - correlation_id
          - job_id?
          - attempt_id?
          - deadline
        validation: safe identifiers only; cancellation/deadline propagated to every
          async adapter
    behavior:
      - story_id: artifact-foundation/story/publish-content-addressed-model-blobs
        given: an existing digest key with different bytes or metadata
        when: publication is attempted
        then: the publisher fails without overwriting the object
      - story_id: artifact-foundation/story/publish-content-addressed-model-blobs
        given: a new model artifact
        when: upload and verification complete
        then: the remote blob is addressable by its verified SHA-256 identity
    error_handling:
      - condition: manifest_invalid
        error: ManifestValidationError
        recovery: Reject the release and return all safe validation defects
        retryable: false
      - condition: artifact_conflict_or_missing
        error: ArtifactIdentityError
        recovery: Do not overwrite; quarantine the publication attempt for review
        retryable: false
      - condition: remote_transient_failure
        error: ArtifactStoreUnavailable
        recovery: Retry with bounded exponential backoff and cancellation
        retryable: true
    dependencies:
      required_slice_ids: []
      external:
        - Python standard library
        - pydantic
        - structlog
        - rclone B2 backend or Backblaze B2 API adapter
      inversion_of_control: All side effects are Protocol dependencies supplied by the
        capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - product configuration, security policy, and injected platform ports
      provides:
        - Versioned model-set manifest, artifact entry, workflow identity,
          provenance, and publication receipt models
        - Canonical JSON serialization and schema fixtures
      documented_routes: []
      reference_documentation:
        - https://www.backblaze.com/docs/en/cloud-storage-application-keys
        - https://rclone.org/b2/
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
      - name: SCHEMA_VERSION
        type: string
        default: "1"
        secret: false
        validation: supported version only
      - name: TRANSFER_CONCURRENCY
        type: integer
        default: 4
        secret: false
        validation: 1..16 and memory-budget checked
      - name: TRANSFER_TIMEOUT_SECONDS
        type: integer
        default: 7200
        secret: false
        validation: "> 0"
      - name: MAX_RETRIES
        type: integer
        default: 5
        secret: false
        validation: 0..10
    observability:
      events:
        - artifact-foundation.immutable-artifact-catalog.1.started
        - artifact-foundation.immutable-artifact-catalog.1.succeeded
        - artifact-foundation.immutable-artifact-catalog.1.failed
      required_fields:
        - event
        - release_id
        - worker_id
        - correlation_id
        - duration_ms
        - outcome
        - error_code?
        - job_id?
        - attempt_id?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
      logging_contract: Use structlog JSON. Emit state changes and adapter failures
        once at the owning boundary; preserve exception cause without
        serializing unsafe payloads.
    security_constraints:
      - Validate at the boundary and pass typed values inward; never rebuild
        paths from unchecked strings.
      - No global clients or ambient credentials; process and adapter roles
        receive the minimum dependency set.
      - Fail closed on identity, authorization, checksum, provenance, readiness,
        and commit uncertainty.
    test_scenarios:
      - id: S1-T01
        level: unit
        given: an existing digest key with different bytes or metadata
        when: publication is attempted
        then: the publisher fails without overwriting the object
      - id: S1-T02
        level: unit
        given: a new model artifact
        when: upload and verification complete
        then: the remote blob is addressable by its verified SHA-256 identity
      - id: S1-TF
        level: failure_injection
        given: each declared error condition is injected at its adapter boundary
        when: Artifact catalog contracts runs
        then: the recovery and retryability contract is observed and no forbidden
          completion or side effect occurs
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported
        return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability
        classification.
      - Structured events cover entry, success, failure, and material state
        transitions without sensitive fields.
      - Unit and adapter-contract tests pass; integration coverage exercises the
        linked stories.
      - No placeholder, TODO, mutable dependency reference, or console-only
        error remains.
    data_lifecycle:
      kind: bounded
      detail: Model blobs are immutable and retained while referenced by an approved
        manifest; unreferenced blobs are removed only by a reviewed catalog GC
        operation. Superseded manifests and provenance records remain versioned
        for release reproducibility.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, and
        explicit exception wrapping with domain context.
      logging: structlog only for application events; provider output is captured,
        classified, and redacted.
      bash: Any entrypoint or helper remains Bash 3.2 compatible and delegates policy
        to typed Python code.
      testing: pytest parametrization for scenario tables; fakes implement the same
        Protocols as production adapters.
