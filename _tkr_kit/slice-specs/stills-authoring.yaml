      - component: image inspection
        layer: integration
        responsibility: Dimensions and encoding from the shared inspector
    interfaces:
      - name: StillsResultValidator.validate
        kind: service_method
        signature: def validate(self, output_root, prompt_outputs, *, job_id, attempt_id, workflow_digest,
          model_set_id, request_hash) -> LocalStillResult
        async: false
        ownership: Attributes outputs by the prompt's own history, never by scanning a directory, as
          the video validator already does.
      - name: image inspection
        kind: port_method
        signature: 'def inspect_image(self, path: Path) -> ImageInfo'
        async: false
        ownership: Proves an image with positive dimensions and an allowlisted encoding.
    data_models:
      - name: ImageInfo
        shape: frozen dataclass
        fields: 'width: int; height: int; encoding: str'
        validation: an encoding outside the allowlist is refused rather than passed through
      - name: LocalStillResult
        shape: frozen dataclass
        fields: job_id; attempt_id; media_path; size_bytes; sha256; image; workflow_digest; model_set_id;
          request_hash
        validation: complete before return, so nothing partial reaches the uploader
    behavior:
      - story_id: stills-authoring/story/generate-one-still
        given: a prompt that produced no image
        when: the result is validated
        then: the attempt fails and nothing is uploaded
