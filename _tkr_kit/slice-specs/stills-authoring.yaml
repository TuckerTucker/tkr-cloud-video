  - name: reference-sheet-assembly-12-spec
    title: Sheet as an assembly of committed stills Specification
    status: planned
    format: full
    capability: stills-authoring
    feature: reference-sheet-assembly
    slice: 12
    source_story_ids:
      - stills-authoring/story/assemble-a-reference-sheet
    purpose: 'Compose a sheet from stills that are already committed rather than generating one as
      an attempt. This is the whole of option A: composed as one generation a sheet would need the
      result contract to be plural from the start; composed as an assembly it needs nothing new from
      delivery, and the plural-result question stays open for a later feature to answer on its own
      merits.'
    layer_assignment:
      - component: ReferenceSheet
        layer: domain
        responsibility: A named, principal-scoped set of committed still identities
      - component: membership policy
        layer: domain
        responsibility: Admit only stills the same principal committed
    interfaces:
      - name: ReferenceSheet
        kind: domain_model
        signature: frozen value carrying a name and an ordered tuple of committed still job identities
        async: false
        ownership: Bounded at four, matching the binding sources a reference request has, so a sheet
          cannot be assembled that cannot be used.
      - name: SheetMembership.admit
        kind: domain_service_method
        signature: 'async def admit(self, principal_id: str, job_id: str) -> bool'
        async: true
        ownership: Refusal and absence share one outcome, matching the non-enumeration property the
          result-access path already holds.
    data_models:
      - name: ReferenceSheet
        shape: frozen dataclass
        fields: 'name: str; members: tuple[str, ...]'
        validation: one to four members; duplicates refused, because two identical references waste
          a binding source
    behavior:
      - story_id: stills-authoring/story/assemble-a-reference-sheet
        given: a sheet naming another principal's still
        when: it is assembled
        then: it is refused indistinguishably from one naming a still that does not exist
      - story_id: stills-authoring/story/assemble-a-reference-sheet
        given: a sheet of five stills
        when: it is assembled
        then: it is refused, because the binding allowlist carries four sources
      - story_id: stills-authoring/story/assemble-a-reference-sheet
        given: a still that was never committed
        when: it is named
        then: it is refused, because nothing conditions on an object with no commit evidence
      - story_id: stills-authoring/story/assemble-a-reference-sheet
        given: a sheet
        when: it is composed
        then: no new attempt is created and no plural result is required
    error_handling:
      - condition: sheet_member_unauthorised_or_absent
        error: outcome
        recovery: Return the same answer for both, so a sheet cannot be used to probe what another
          principal committed
        retryable: false
      - condition: sheet_too_large
        error: ValueError
        recovery: Refuse more members than there are binding sources
        retryable: false
      - condition: sheet_member_uncommitted
        error: AppError
        recovery: Refuse a member with no commit marker
        retryable: false
    dependencies:
      required_slice_ids:
        - 11
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - committed stills and their markers
      provides:
        - a validated, principal-scoped reference sheet
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - stills-authoring.reference-sheet-assembly.12.started
        - stills-authoring.reference-sheet-assembly.12.succeeded
        - stills-authoring.reference-sheet-assembly.12.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - Membership is checked against commit evidence, not against a caller's claim.
      - Unauthorised and absent are one outcome, so a sheet cannot enumerate another principal's work.
    test_scenarios:
      - id: S12-T01
        level: unit
        given: another principal's still
        when: a sheet is assembled
        then: it is refused
      - id: S12-T02
        level: unit
        given: an unauthorised member and an absent member
        when: each is admitted
        then: the outcomes are equal
      - id: S12-T03
        level: unit
        given: five members
        when: a sheet is assembled
        then: it is refused
      - id: S12-T04
        level: unit
        given: an uncommitted still
        when: it is named
        then: it is refused
      - id: S12-TF
        level: failure_injection
        given: a duplicate member
        when: a sheet is assembled
        then: it is refused
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: exempt
      detail: Introduces no store. A sheet is a value composed from already-committed job identities
        and is discarded with the request that composed it.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
  - name: reference-sheet-assembly-13-spec
    title: Promotion into the input namespace Specification
    status: planned
    format: full
    capability: stills-authoring
    feature: reference-sheet-assembly
    slice: 13
    source_story_ids:
      - stills-authoring/story/assemble-a-reference-sheet
    purpose: 'Make a committed still usable as a reference by copying it into the requesting principal''s
      input namespace, digest preserved. Promotion rather than direct write is the point: a still committed
      and then promoted carries commit evidence before anything conditions on it, where a still written
      straight into inputs would be a conditioning object with no marker, no verified digest and no
      attempt behind it.'
    layer_assignment:
      - component: StillPromoter
        layer: service
        responsibility: Copy a committed still into the principal's input namespace
      - component: promotion record
        layer: domain
        responsibility: Which input object came from which committed attempt
    interfaces:
      - name: StillPromoter.promote
        kind: service_method
        signature: 'async def promote(self, principal_id: str, job_id: str) -> PromotedInput'
        async: true
        ownership: Reads the committed marker first, so a still with no marker is refused before anything
          is copied.
      - name: PromotedInput
        kind: domain_model
        signature: the input key, the source attempt and the preserved digest
        async: false
        ownership: Carries the source attempt so a later reader can tell where a conditioning object
          came from.
    data_models:
      - name: PromotedInput
        shape: frozen dataclass
        fields: 'object_key: str; source_job_id: str; source_attempt_id: str; sha256: str'
        validation: the digest equals the committed one, so the promoted object is provably the committed
          object
    behavior:
      - story_id: stills-authoring/story/assemble-a-reference-sheet
        given: a committed still
        when: it is promoted
        then: it lands in the requesting principal's input namespace
      - story_id: stills-authoring/story/assemble-a-reference-sheet
        given: a promoted still
        when: its digest is compared with the committed one
        then: they are equal
      - story_id: stills-authoring/story/assemble-a-reference-sheet
        given: a still with no commit marker
        when: promotion is attempted
        then: it is refused before anything is copied
      - story_id: stills-authoring/story/assemble-a-reference-sheet
        given: a promoted object
        when: it is read later
        then: the attempt it came from is recoverable
    error_handling:
      - condition: promotion_source_uncommitted
        error: AppError
        recovery: Refuse; commit evidence is what makes a still safe to condition on
        retryable: false
      - condition: promotion_digest_mismatch
        error: AppError
        recovery: Refuse and leave nothing behind, so a corrupt copy never sits under a plausible name
        retryable: false
    dependencies:
      required_slice_ids:
        - 12
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the committed still and its marker
        - the principal-scoped input namespace
      provides:
        - an input object a reference request can name
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - stills-authoring.reference-sheet-assembly.13.started
        - stills-authoring.reference-sheet-assembly.13.succeeded
        - stills-authoring.reference-sheet-assembly.13.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - The promoted object lands only in the requesting principal's own namespace.
      - A mismatched digest leaves nothing behind, matching how a committed artifact is fetched.
      - Promotion writes an input; it never writes or alters an output.
    test_scenarios:
      - id: S13-T01
        level: unit
        given: a committed still
        when: it is promoted
        then: it lands in the caller's namespace
      - id: S13-T02
        level: unit
        given: the promoted object
        when: its digest is compared
        then: it equals the committed digest
      - id: S13-T03
        level: unit
        given: an uncommitted still
        when: promotion runs
        then: it is refused before copying
      - id: S13-TF
        level: failure_injection
        given: a digest mismatch during copy
        when: promotion runs
        then: nothing is left behind
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: bounded
      detail: 'Copies a committed still into the inputs prefix, which carries its own declared retention
        class and lifecycle rule. The promoted copy and the committed original expire on their own
        clocks, which is correct: one is a deliverable and the other is an input, and conflating them
        would give an input the deliverable period.'
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
