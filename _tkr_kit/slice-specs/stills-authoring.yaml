  - name: stills-generation-6-spec
    title: Stills request contract Specification
    status: planned
    format: full
    capability: stills-authoring
    feature: stills-generation
    slice: 6
    source_story_ids:
      - stills-authoring/story/generate-one-still
    purpose: Describe a still in its own terms. A temporal field is refused as unknown rather than
      ignored, because a request carrying a frame count is a request the caller misunderstood, and
      silently dropping it would produce an image they did not ask for and cannot explain.
    layer_assignment:
      - component: StillsRequest
        layer: domain
        responsibility: The versioned request for one still
      - component: canvas resolution
        layer: domain
        responsibility: Defaults and bounds from the stills registry
      - component: job identity
        layer: domain
        responsibility: The same principal-scoped derivation the video path uses
    interfaces:
      - name: parse_stills_request
        kind: domain_function
        signature: 'def parse_stills_request(payload: object, canvases: Mapping[str, StillsCanvas]
          | None = None) -> StillsRequest'
        async: false
        ownership: Injectable canvas population, so a test can parse against a population of one.
      - name: StillsRequest.request_hash
        kind: domain_method
        signature: def request_hash(self) -> str
        async: false
        ownership: Canonical and principal-independent, so job identity derives the same way it does
          for video.
    data_models:
      - name: StillsRequest
        shape: immutable pydantic model
        fields: schema_version; workflow_id; model_set_id; prompt; seed; width; height
        validation: extra fields are forbidden, so frames and fps are refused by name rather than dropped;
          absent dimensions resolve from the registered canvas
    behavior:
      - story_id: stills-authoring/story/generate-one-still
        given: a request carrying a frame count
        when: it is parsed
        then: it is refused naming the unknown field, rather than generating an image the caller did
          not describe
      - story_id: stills-authoring/story/generate-one-still
        given: a request naming no canvas
        when: it is parsed
        then: it lands on the registered defaults for its model set
      - story_id: stills-authoring/story/generate-one-still
        given: a canvas off the registered multiple or over the ceiling
        when: it is parsed
        then: it is refused naming the rule
      - story_id: stills-authoring/story/generate-one-still
        given: the same request twice
        when: identity is derived
        then: the same job and attempt identity result
    error_handling:
      - condition: invalid_request
        error: ValidationError
        recovery: Report every field-scoped defect together and submit nothing
        retryable: false
      - condition: no_registered_canvas
        error: ValueError
        recovery: Refuse an unregistered stills model set rather than guessing its canvas
        retryable: false
    dependencies:
      required_slice_ids:
        - 5
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the stills canvas registry
      provides:
        - a validated stills request and its canonical hash
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - stills-authoring.stills-generation.6.started
        - stills-authoring.stills-generation.6.succeeded
        - stills-authoring.stills-generation.6.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - Unknown fields are refused rather than ignored, so a misunderstood request fails loudly.
      - 'The prompt is a caller value: it is never logged and never enters an error context.'
    test_scenarios:
      - id: S6-T01
        level: unit
        given: a request carrying frames or fps
        when: parsing runs
        then: it is refused naming the field
      - id: S6-T02
        level: unit
        given: a request naming no canvas
        when: parsing runs
        then: the registered defaults are filled
      - id: S6-T03
        level: unit
        given: a canvas over the ceiling and one off the multiple
        when: parsing runs
        then: each is refused naming its rule
      - id: S6-TF
        level: failure_injection
        given: a payload that is not an object
        when: parsing runs
        then: it is refused as an envelope defect
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: exempt
      detail: Introduces no store. The contract types are in-process values constructed per request
        and discarded with it.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
  - name: stills-generation-7-spec
    title: Stills result contract Specification
    status: planned
    format: full
    capability: stills-authoring
    feature: stills-generation
    slice: 7
    source_story_ids:
      - stills-authoring/story/generate-one-still
      - stills-authoring/story/leave-the-video-contract-untouched
    purpose: Commit a still under a contract of its own. The video result requires exactly one artifact
      per role and its roles include a video; durable-delivery is done and terminal and that contract
      is a published assertion, so admitting an image into it would loosen something other things depend
      on being tight. This is a sibling, and the attempt stays singular.
    layer_assignment:
      - component: StillsResultManifest
        layer: domain
        responsibility: The commit marker for one still
      - component: StillsResultRole
        layer: domain
        responsibility: Image, workflow and generation
      - component: published description
        layer: data
        responsibility: The stills result assertion, sibling to the video one
    interfaces:
      - name: StillsResultManifest
        kind: contract_model
        signature: immutable pydantic model; extra=forbid, frozen
        async: false
        ownership: Requires exactly one artifact per role and one role per artifact, the same shape
          the video contract holds.
      - name: StillsResultManifest.commit_key
        kind: property
        signature: the final consumer-visible marker key
        async: false
        ownership: Under the same immutable attempt prefix layout, so the reconciler reaches it unchanged.
    data_models:
      - name: StillsResultRole
        shape: string enum
        fields: IMAGE; WORKFLOW; GENERATION
        validation: no video role exists here, and no image role is added to the video contract
      - name: StillsResultManifest
        shape: immutable pydantic model
        fields: schema_version; job_id; attempt_id; workflow_digest; model_set_id; request_hash; committed_at;
          artifacts
        validation: every artifact key must start with the attempt prefix, so a marker cannot name
          an artifact outside its own attempt
    behavior:
      - story_id: stills-authoring/story/generate-one-still
        given: a still and its records
        when: they are committed
        then: the marker names exactly one image, one workflow and one generation
      - story_id: stills-authoring/story/generate-one-still
        given: a marker naming two images
        when: it is constructed
        then: it is refused, because one attempt commits one image
      - story_id: stills-authoring/story/leave-the-video-contract-untouched
        given: the video result contract
        when: a still is committed
        then: its roles and their cardinality are unchanged
      - story_id: stills-authoring/story/generate-one-still
        given: a marker naming an artifact outside its attempt prefix
        when: it is constructed
        then: it is refused
    error_handling:
      - condition: stills_result_roles_incomplete
        error: ValueError
        recovery: Refuse a marker that does not carry exactly one artifact per role
        retryable: false
      - condition: artifact_outside_attempt_prefix
        error: ValueError
        recovery: Refuse; an attempt's marker may only vouch for its own attempt
        retryable: false
    dependencies:
      required_slice_ids:
        - 6
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the existing commit protocol and attempt prefix layout
      provides:
        - a commit marker for one still
        - a published description of the stills result
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - stills-authoring.stills-generation.7.started
        - stills-authoring.stills-generation.7.succeeded
        - stills-authoring.stills-generation.7.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - The video contract is not widened. Admitting an image there would weaken a guarantee the delivery
        path and its published assertion both rest on.
      - The attempt stays singular, so the plural-result question is left open rather than decided
        here.
    test_scenarios:
      - id: S7-T01
        level: unit
        given: one image, workflow and generation
        when: a marker is built
        then: it validates
      - id: S7-T02
        level: unit
        given: two images
        when: a marker is built
        then: it is refused
      - id: S7-T03
        level: unit
        given: an artifact outside the attempt prefix
        when: a marker is built
        then: it is refused
      - id: S7-T04
        level: unit
        given: the video result contract
        when: it is inspected
        then: its roles are unchanged
      - id: S7-TF
        level: failure_injection
        given: a marker missing a role
        when: it is built
        then: it is refused naming the role
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: bounded
      detail: Commits objects under the outputs prefix, which already carries a declared retention
        class reconciled by the presence of a result marker. A committed still is a deliverable on
        the deliverable period, exactly as a committed video is; no class is introduced that the existing
        reconciler cannot reach.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
  - name: stills-generation-8-spec
    title: Image output validation Specification
    status: planned
    format: full
    capability: stills-authoring
    feature: stills-generation
    slice: 8
    source_story_ids:
      - stills-authoring/story/generate-one-still
      - stills-authoring/story/leave-the-video-contract-untouched
    purpose: Prove the prompt produced one image. The video validator requires a video stream and a
      positive duration and is right to; it would refuse every still, so the stills path needs its
      own and neither may be relaxed to serve the other.
    layer_assignment:
      - component: StillsResultValidator
