        given: a prompt that produced several images
        when: the result is validated
        then: the attempt fails, because one attempt commits one image
      - story_id: stills-authoring/story/generate-one-still
        given: an output path escaping its root
        when: the result is validated
        then: it is refused
      - story_id: stills-authoring/story/leave-the-video-contract-untouched
        given: a video output with no video stream
        when: the video validator runs
        then: it is still refused
    error_handling:
      - condition: result_set_invalid
        error: AppError
        recovery: Refuse a prompt that produced other than one image
        retryable: false
      - condition: result_path_escape
        error: AppError
        recovery: Refuse an output outside its server-owned root
        retryable: false
      - condition: result_media_invalid
        error: AppError
        recovery: Refuse a file that is not a valid image of positive dimensions
        retryable: false
    dependencies:
      required_slice_ids:
        - 7
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
