capability: stills-authoring
slice_specs:
  - name: stills-release-1-spec
    title: Stills model facts of record Specification
    status: planned
    format: full
    capability: stills-authoring
    feature: stills-release
    slice: 1
    source_story_ids:
      - stills-authoring/story/establish-the-stills-model-facts
    purpose: 'Establish three facts the rest of this capability is written against and that nothing
      here asserts: whether the nodes the graph needs exist at the pinned ComfyUI revision, what the
      licence permits against the territories workers are already placed in, and what the weights cost.
      Each blocks differently, so each is recorded rather than assumed.'
    layer_assignment:
      - component: model facts record
        layer: data
        responsibility: A dated record of node availability, licence terms and capacity
    interfaces:
      - name: stills model facts
        kind: document
        signature: pinned revision checked; nodes present or absent; licence terms against deployed
          territories; weight sizes; disk and accelerator need
        async: false
        ownership: States what each finding was verified against, so a reader can re-check it rather
          than trust the prose, the way the trained envelope records its source.
    data_models:
      - name: model facts record
        shape: markdown document
        fields: Date; the revision checked; node findings; licence findings; capacity findings
        validation: a finding that could not be established is recorded as unestablished rather than
          omitted
    behavior:
      - story_id: stills-authoring/story/establish-the-stills-model-facts
        given: nodes absent at the pinned revision
        when: the finding is recorded
        then: the capability stays blocked, because bumping the revision is worker-runtime's work and
          reaches the video endpoint
      - story_id: stills-authoring/story/establish-the-stills-model-facts
        given: a licence that does not reach a deployed territory
        when: the finding is recorded
        then: the capability stays blocked rather than proceeding toward an approval no reviewer could
          sign
      - story_id: stills-authoring/story/establish-the-stills-model-facts
        given: a later revision or model version
        when: it changes
        then: the findings are restated rather than inherited, because they were about the version
          checked
    error_handling:
      - condition: nodes_absent_at_pinned_revision
        error: execution gate
        recovery: Keep the capability blocked and raise the revision bump as worker-runtime work
        retryable: false
      - condition: licence_does_not_reach_territory
        error: execution gate
        recovery: Keep the capability blocked; an unapprovable licence is not a smaller problem than
          an absent node
        retryable: false
      - condition: capacity_exceeds_endpoint_sizing
        error: execution gate
        recovery: Reconsider the separate endpoint, whose whole justification is that stills cost less
          than a video model set
        retryable: false
    dependencies:
      required_slice_ids: []
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the pinned ComfyUI revision
        - the deployed territories
        - the endpoint sizing
      provides:
        - a record of what is true about the candidate stills model
      documented_routes: []
      reference_documentation:
        - The pinned revision is an argument of the worker image build; the territories are recorded
          in the placement decision record.
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - stills-authoring.stills-release.1.facts_recorded
      required_fields:
        - event
        - outcome
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - A licence finding is recorded as read, never as inferred from a family or a sibling model.
    test_scenarios:
      - id: S1-T01
        level: review
        given: the pinned revision
        when: the graph's nodes are looked for
        then: presence or absence is recorded
      - id: S1-T02
        level: review
        given: the licence text
        when: it is read against the deployed territories
        then: the reach is recorded
      - id: S1-T03
        level: review
        given: the published weights
        when: their size and capacity need are measured
        then: both are recorded
      - id: S1-T04
        level: review
        given: any finding that cannot be established
        when: the record is written
        then: it is recorded as unestablished
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: exempt
      detail: Introduces no store. The graph, binding map and canvas table are versioned in git and
        shipped in the pinned image; the published manifest is immutable and digest-addressed under
        the existing artifact layout.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
  - name: stills-release-2-spec
    title: Stills workflow graph and canvas registry Specification
    status: planned
    format: full
    capability: stills-authoring
    feature: stills-release
    slice: 2
    source_story_ids:
      - stills-authoring/story/publish-a-stills-model-set
    purpose: Publish a graph that ends in an image and a canvas table that describes a still. The registry
      is a sibling of the trained envelope rather than an extension of it, because that envelope carries
      a frame floor, a frame ceiling and a temporal grid, and registering a stills model there would
      mean inventing three values that describe nothing and are then enforced.
    layer_assignment:
      - component: stills workflow graph
        layer: data
        responsibility: A ComfyUI graph ending in an image save
      - component: stills binding map
        layer: data
        responsibility: Request sources mapped to node inputs, temporal sources absent
      - component: StillsCanvas registry
        layer: data
        responsibility: Canvas bounds keyed by model-set identity, digest-verified at import
    interfaces:
      - name: workflow-api.json
        kind: artifact
        signature: ComfyUI API-format graph terminating in an image save
        async: false
        ownership: Immutable once published and addressed by digest; a change is a new revision.
      - name: STILLS_CANVASES
        kind: registry
        signature: mapping of model-set identity to StillsCanvas
        async: false
        ownership: Keyed on the full identifier, so a rebuild has to affirm its bounds rather than
          inherit them by prefix.
      - name: CANVAS_DIGEST
        kind: integrity_constant
        signature: the digest the table must reproduce at import
        async: false
        ownership: Restating it is the act that records a deliberate change to where a default still
          lands.
    data_models:
      - name: StillsCanvas
        shape: frozen dataclass
        fields: model_set_id; default_width; default_height; max_edge; canvas_multiple; source
        validation: construction rejects a table that cannot describe a reachable request; source names
          what the bounds were verified against
      - name: WorkflowBinding
        shape: existing release model
        fields: source; node_id; input_name
        validation: a temporal source is refused for a stills graph, because a still has no frames
          and no frame rate
    behavior:
      - story_id: stills-authoring/story/publish-a-stills-model-set
        given: a binding map naming a frame or frame-rate source
        when: the catalog is validated
        then: it is refused, because those sources describe nothing a still has
      - story_id: stills-authoring/story/publish-a-stills-model-set
        given: an edited canvas table with an unchanged digest
        when: the module is imported
        then: the import fails rather than serving a silently changed default
      - story_id: stills-authoring/story/publish-a-stills-model-set
        given: a stills request naming no canvas
        when: it is resolved
        then: it lands on the registered defaults for the model set it names
    error_handling:
      - condition: temporal_binding_on_stills_graph
        error: ValidationError
        recovery: Refuse the catalog at render time
        retryable: false
      - condition: canvas_digest_mismatch
        error: StillsCanvasIntegrityError
        recovery: Fail at import rather than serve a changed default
        retryable: false
      - condition: no_registered_canvas
        error: ValueError
        recovery: Refuse a request naming an unregistered stills model set
        retryable: false
    dependencies:
      required_slice_ids:
        - 1
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the recorded model facts
        - the existing binding allowlist
      provides:
        - a graph a stills request can bind into
        - canvas defaults and bounds for stills
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - stills-authoring.stills-release.2.started
        - stills-authoring.stills-release.2.succeeded
        - stills-authoring.stills-release.2.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - The graph is immutable and digest-addressed; a revision is published, never edited in place.
      - No new binding source is introduced; the release binding vocabulary is unchanged.
    test_scenarios:
      - id: S2-T01
        level: unit
        given: a map naming a frames source
        when: the catalog is validated
        then: it is refused
      - id: S2-T02
        level: unit
        given: an unregistered stills model set
        when: a request is resolved
        then: it is refused rather than defaulted
      - id: S2-T03
        level: unit
        given: a canvas off the registered multiple
        when: a request is validated
        then: it is refused naming the multiple
      - id: S2-TF
        level: failure_injection
        given: an edited table with a stale digest
        when: the module is imported
        then: the import fails
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: exempt
      detail: Introduces no store. The graph, binding map and canvas table are versioned in git and
        shipped in the pinned image; the published manifest is immutable and digest-addressed under
        the existing artifact layout.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
  - name: stills-release-3-spec
    title: Stills release approval and publication Specification
    status: planned
    format: full
    capability: stills-authoring
    feature: stills-release
    slice: 3
    source_story_ids:
      - stills-authoring/story/publish-a-stills-model-set
    purpose: Publish the stills release under an approval that covers it. The gate compares the approval's
      model set and manifest digest against the rendered manifest, so a stills model set without its
      own signed approval is unpublishable rather than merely undocumented.
    layer_assignment:
      - component: stills manifest
        layer: data
        responsibility: The rendered manifest for the stills catalog
      - component: licence approval
        layer: data
        responsibility: A reviewer approval bound to that manifest digest
      - component: publication path
        layer: service
        responsibility: The existing publish flow, workflow last
    interfaces:
      - name: prepare/publish release
        kind: service
        signature: the existing release commands, given the stills catalog and approval identifier
        async: false
        ownership: Reused unchanged; the stills release is a release like any other.
      - name: release gate
        kind: service
        signature: compares approval model set and manifest digest against the rendered manifest
        async: false
        ownership: Reused unchanged, which is why an uncovered digest fails publication rather than
          a run.
    data_models:
      - name: licence approval
        shape: existing model
        fields: approval_id; reviewer_id; model_set_id; manifest_digest; deployment_use; territories;
          approved_at; expires_at; constraints
        validation: territories are those the recorded licence findings support, not those the video
          approval happens to carry
    behavior:
      - story_id: stills-authoring/story/publish-a-stills-model-set
        given: an approval bound to a different digest
        when: publication runs
        then: the gate refuses
      - story_id: stills-authoring/story/publish-a-stills-model-set
        given: an expired approval
        when: publication runs
        then: it is refused
      - story_id: stills-authoring/story/publish-a-stills-model-set
        given: territories beyond what the licence findings support
        when: an approval is drafted
        then: it is not signed, because the findings are what the reviewer is signing against
    error_handling:
      - condition: approval_digest_mismatch
        error: release gate failure
        recovery: Refuse publication and require a signature bound to the new digest
        retryable: false
      - condition: approval_expired
        error: release gate failure
        recovery: Refuse; an expired approval is not a weaker approval
        retryable: false
      - condition: territory_beyond_licence_findings
        error: review failure
        recovery: Refuse to draft an approval wider than the recorded findings support
        retryable: false
    dependencies:
      required_slice_ids:
        - 2
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the stills catalog
        - the recorded licence findings
      provides:
        - a published, digest-addressed stills release
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - stills-authoring.stills-release.3.started
        - stills-authoring.stills-release.3.succeeded
        - stills-authoring.stills-release.3.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - The approval is human-signed; nothing in this slice may mint one.
      - Territories are derived from the recorded findings, never copied from the video approval.
    test_scenarios:
      - id: S3-T01
        level: unit
        given: a digest not matching the approval
        when: the gate runs
        then: publication is refused
      - id: S3-T02
        level: unit
        given: an expired approval
        when: the gate runs
        then: publication is refused
      - id: S3-T03
        level: integration
        given: a valid approval and catalog
        when: publication runs
        then: the workflow is published last
      - id: S3-TF
        level: failure_injection
        given: a partial publication
        when: it is retried
        then: no consumer-visible release exists for an unverified artifact set
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: exempt
      detail: Introduces no store. The graph, binding map and canvas table are versioned in git and
        shipped in the pinned image; the published manifest is immutable and digest-addressed under
        the existing artifact layout.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
  - name: stills-release-4-spec
    title: Wire Stills Release Specification
    status: planned
    format: full
    capability: stills-authoring
    feature: stills-release
    slice: 4
    source_story_ids:
      - stills-authoring/story/publish-a-stills-model-set
    purpose: 'Stand the stills endpoint up as its own endpoint. A worker resolves one model set at
      startup and refuses a manifest naming another, so this is a deployment, not a mode: the separation
      is what keeps a request producing one image from paying a video model set''s hydration.'
    layer_assignment:
      - component: stills deployment
        layer: integration
        responsibility: A second Serverless endpoint resolving the stills manifest
      - component: stills composition
        layer: integration
        responsibility: The composed stills runtime, sharing the worker's supervision
    interfaces:
      - name: compose_stills_deployment
        kind: composition_root
        signature: def compose_stills_deployment(environment, event_sink) -> StillsDeployment
        async: false
        ownership: Reuses the supervised runtime and hydration path; only the model set, workflow and
          result path differ.
      - name: endpoint configuration
        kind: deployment
        signature: TKR_MODEL_SET_ID and TKR_MANIFEST_DIGEST naming the stills release
        async: false
        ownership: Each endpoint resolves exactly one model set, which is what makes the separation
          structural.
    data_models:
      - name: stills endpoint settings
        shape: validated settings
        fields: the worker settings, naming the stills model set and digest
        validation: a manifest whose model set differs from the configured one is refused at startup
    behavior:
      - story_id: stills-authoring/story/publish-a-stills-model-set
        given: the stills endpoint
        when: it starts
        then: it resolves the stills manifest and validates its workflow and models
      - story_id: stills-authoring/story/publish-a-stills-model-set
        given: a manifest naming another model set
        when: it is resolved
        then: startup refuses, as it already does for the video endpoint
      - story_id: stills-authoring/story/publish-a-stills-model-set
        given: the video endpoint
        when: the stills endpoint is deployed
        then: its configuration, contracts and image are unchanged
    error_handling:
      - condition: model_set_identity_mismatch
        error: AppError
        recovery: Refuse startup; a worker serving a model set it was not configured for is unreproducible
        retryable: false
    dependencies:
      required_slice_ids:
        - 3
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the published stills release
        - the existing supervised runtime
      provides:
        - a running stills endpoint
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - stills-authoring.stills-release.4.started
        - stills-authoring.stills-release.4.succeeded
        - stills-authoring.stills-release.4.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - The two endpoints share no credential beyond what each needs for its own prefixes.
      - The video endpoint is not reconfigured to accommodate this one.
    test_scenarios:
      - id: S4-T01
        level: integration
        given: the stills manifest
        when: the endpoint starts
        then: readiness follows workflow and model validation
      - id: S4-T02
        level: unit
        given: a mismatched manifest
        when: startup runs
        then: it is refused
      - id: S4-T03
        level: unit
        given: the video endpoint configuration
        when: the stills endpoint is added
        then: it is unchanged
      - id: S4-TF
        level: failure_injection
        given: an unresolvable manifest digest
        when: startup runs
        then: readiness stays false
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: exempt
      detail: Introduces no store. The graph, binding map and canvas table are versioned in git and
        shipped in the pinned image; the published manifest is immutable and digest-addressed under
        the existing artifact layout.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
