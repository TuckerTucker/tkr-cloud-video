        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - stills-authoring.stills-generation.8.started
        - stills-authoring.stills-generation.8.succeeded
        - stills-authoring.stills-generation.8.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
