capability: worker-runtime
slice_specs:
  - name: reproducible-worker-image-1-spec
    title: Worker build manifest Specification
    status: approved
    format: full
    capability: worker-runtime
    feature: reproducible-worker-image
    slice: 1
    source_story_ids:
      - worker-runtime/story/build-pinned-worker-image
    purpose: Implement Worker build manifest as the data contract that
      machine-readable image release manifest for base image, python lock,
      comfyui, custom nodes, tools, schemas, and verification commands.
    layer_assignment:
      - component: WorkerBuildManifestPort
        layer: data
        responsibility: Machine-readable image release manifest for base image, Python
          lock, ComfyUI, custom nodes, tools, schemas, and verification commands
      - component: injected ports/adapters
        layer: integration
        responsibility: Provide filesystem, object storage, process, clock,
          authorization, media, and telemetry effects without coupling domain
          policy to providers
    interfaces:
      - name: WorkerBuildManifestPort
        kind: schema_or_repository_port
        signature: "async def execute(self, request: WorkerBuildManifestRequest,
          context: OperationContext) -> WorkerBuildManifestResult"
        async: true
        ownership: The feature composition root constructs the implementation and
          injects all side-effecting ports.
      - name: WorkerBuildManifestError
        kind: typed_error
        signature: "code: str; safe_message: str; retryable: bool; context: Mapping[str,
          str]"
        async: false
        ownership: Carries allowlisted diagnostic context only; cause chains are logged
          through structural redaction.
    data_models:
      - name: WorkerBuildManifestRequest
        shape: immutable Pydantic model
        fields: Only normalized identifiers, typed parameters, and already-authorized
          references required by this operation.
        validation: forbid unknown fields; reject control characters and unsafe paths at
          construction
      - name: WorkerBuildManifestResult
        shape: frozen dataclass or Pydantic model
        fields: Machine-readable image release manifest for base image, Python lock,
          ComfyUI, custom nodes, tools, schemas, and verification
          commands,Deterministic build metadata exposed without secrets
        validation: must be complete before return; no secret, signed URL token, full
          prompt, or user filename fields
      - name: OperationContext
        shape: frozen dataclass
        fields:
          - release_id
          - worker_id
          - correlation_id
          - job_id?
          - attempt_id?
          - deadline
        validation: safe identifiers only; cancellation/deadline propagated to every
          async adapter
    behavior:
      - story_id: worker-runtime/story/build-pinned-worker-image
        given: the same source and locks are built in a clean environment
        when: release metadata is compared
        then: the dependency and revision manifest is identical
      - story_id: worker-runtime/story/build-pinned-worker-image
        given: a Docker layer or build argument contains a runtime secret
        when: release scanning runs
        then: publication fails and identifies the unsafe source
    error_handling:
      - condition: configuration_invalid
        error: RuntimeConfigurationError
        recovery: Aggregate safe field errors and exit before side effects
        retryable: false
      - condition: capacity_or_dependency_missing
        error: WorkerPreflightError
        recovery: Keep the worker unready and identify the failed precondition
        retryable: false
      - condition: build_identity_mismatch
        error: BuildAssuranceError
        recovery: Block image publication or deployment
        retryable: false
    dependencies:
      required_slice_ids: []
      external:
        - Python standard library
        - pydantic
        - structlog
      inversion_of_control: All side effects are Protocol dependencies supplied by the
        capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - product configuration, security policy, and injected platform ports
      provides:
        - Machine-readable image release manifest for base image, Python lock,
          ComfyUI, custom nodes, tools, schemas, and verification commands
        - Deterministic build metadata exposed without secrets
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
      - name: SCHEMA_VERSION
        type: string
        default: "1"
        secret: false
        validation: supported version only
    observability:
      events:
        - worker-runtime.reproducible-worker-image.1.started
        - worker-runtime.reproducible-worker-image.1.succeeded
        - worker-runtime.reproducible-worker-image.1.failed
      required_fields:
        - event
        - release_id
        - worker_id
        - correlation_id
        - duration_ms
        - outcome
        - error_code?
        - job_id?
        - attempt_id?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
      logging_contract: Use structlog JSON. Emit state changes and adapter failures
        once at the owning boundary; preserve exception cause without
        serializing unsafe payloads.
    security_constraints:
      - Validate at the boundary and pass typed values inward; never rebuild
        paths from unchecked strings.
      - No global clients or ambient credentials; process and adapter roles
        receive the minimum dependency set.
      - Fail closed on identity, authorization, checksum, provenance, readiness,
        and commit uncertainty.
    test_scenarios:
      - id: S1-T01
        level: unit
        given: the same source and locks are built in a clean environment
        when: release metadata is compared
        then: the dependency and revision manifest is identical
      - id: S1-T02
        level: unit
        given: a Docker layer or build argument contains a runtime secret
        when: release scanning runs
        then: publication fails and identifies the unsafe source
      - id: S1-TF
        level: failure_injection
        given: each declared error condition is injected at its adapter boundary
        when: Worker build manifest runs
        then: the recovery and retryability contract is observed and no forbidden
          completion or side effect occurs
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported
        return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability
        classification.
      - Structured events cover entry, success, failure, and material state
        transitions without sensitive fields.
      - Unit and adapter-contract tests pass; integration coverage exercises the
        linked stories.
      - No placeholder, TODO, mutable dependency reference, or console-only
        error remains.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, and
        explicit exception wrapping with domain context.
      logging: structlog only for application events; provider output is captured,
        classified, and redacted.
      bash: Any entrypoint or helper remains Bash 3.2 compatible and delegates policy
        to typed Python code.
      testing: pytest parametrization for scenario tables; fakes implement the same
        Protocols as production adapters.
    data_lifecycle:
      kind: immutable
      detail: Promoted OCI images and release manifests are retained by digest. Build
        workspaces and unverified caches are disposable and cleaned after the
        build; unpromoted images follow bounded registry retention.
