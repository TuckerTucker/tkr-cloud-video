  - name: authorized-console-delivery-6-spec
    title: Session registry and derived authorization Specification
    status: approved
    format: full
    capability: operator-console
    feature: authorized-console-delivery
    slice: 6
    source_story_ids:
      - operator-console/story/play-back-a-committed-video
      - operator-console/story/detect-a-principal-mismatch
    purpose: Make authorization structural rather than asserted. A job's identity is a one-way digest
      over the principal and the canonical request hash, so this surface can only name a job whose
      request it holds; a job identifier typed into an address bar resolves exactly as an absent one,
      which is the property the delivery policy already holds against outsiders.
    layer_assignment:
      - component: derive_identity
        layer: domain
        responsibility: Recompute the job and attempt identity the generation path mints
      - component: JobRegistry
        layer: domain
        responsibility: The session's own record of what it submitted
      - component: RegisteredJobAuthorizer
        layer: domain
        responsibility: Admit only a job this console derived for its principal
      - component: AttemptResultRepository
        layer: integration
        responsibility: Read committed state at the derived attempt key
    interfaces:
      - name: derive_identity
        kind: domain_function
        signature: 'def derive_identity(principal_id: str, request_hash: str) -> tuple[str, str]'
        async: false
        ownership: 'Mirrors the generation path exactly. Duplicated rather than imported for the same
          reason the subject-request path duplicates it, and pinned by test against that function:
          a console deriving differently would report every successful generation as missing.'
      - name: JobRegistry
        kind: domain_service
        signature: def register(...) -> JobRecord; def by_job(job_id) -> JobRecord | None; def by_run(run_id)
          -> JobRecord | None
        async: false
        ownership: 'Guarded by a threading lock, not an asyncio one: each request runs its own event
          loop, and a lock bound to one loop cannot be awaited from another.'
      - name: RegisteredJobAuthorizer
        kind: domain_service
        signature: 'async def allowed(self, principal_id: str, job_id: str) -> bool'
        async: true
        ownership: Returns false for a job nothing here derived and for any other principal.
      - name: AttemptResultRepository
        kind: integration_adapter
        signature: async def state(job_id) -> ResultState; async def manifest(job_id) -> ResultManifest
          | None
        async: true
        ownership: Addresses the exact commit key, so no listing and therefore no enumeration capability
          is needed.
    data_models:
      - name: JobRecord
        shape: frozen dataclass
        fields: job_id; attempt_id; request_hash; run_id; submitted_at; model_set_id; below_trained_envelope
        validation: commit_key is derived from job and attempt identity rather than stored
    behavior:
      - story_id: operator-console/story/play-back-a-committed-video
        given: a job this console derived
        when: it is looked up
        then: its committed state is answered
      - story_id: operator-console/story/play-back-a-committed-video
        given: a job identifier nothing here derived
        when: it is looked up
        then: the answer is indistinguishable from an absent job
      - story_id: operator-console/story/detect-a-principal-mismatch
        given: a marker naming a different job than its key
        when: it is read
        then: it is refused rather than trusted
      - story_id: operator-console/story/play-back-a-committed-video
        given: a registered job with no committed marker
        when: it is looked up
        then: it reads as in progress rather than absent
    error_handling:
      - condition: result_marker_invalid
        error: AppError
        recovery: Refuse a marker that does not satisfy the result contract
        retryable: false
      - condition: result_marker_mismatched
        error: AppError
        recovery: Refuse a marker naming a different job than the key it sits under
        retryable: false
    dependencies:
      required_slice_ids:
        - 1
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the derived job identity
        - the committed result marker
      provides:
        - session-scoped authorization
        - committed state for a derived job
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - operator-console.authorized-console-delivery.6.started
        - operator-console.authorized-console-delivery.6.succeeded
        - operator-console.authorized-console-delivery.6.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - Authorization is derived from what the caller already holds, so no table can disagree with
        the identity.
      - Unauthorized and absent are one outcome, matching the non-enumeration property of the result-access
        path.
      - 'The registry is in memory by choice: a durable one would be a new record of job identities
        with no retention clock.'
    test_scenarios:
      - id: S6-T01
        level: unit
        given: a derived job
        when: authorization is checked
        then: it is admitted for its own principal and refused for another
      - id: S6-T02
        level: unit
        given: a principal and request hash
        when: identity is derived
        then: it equals what the generation path mints
      - id: S6-T03
        level: unit
        given: a marker naming another job
        when: it is read
        then: it is refused naming the mismatch
      - id: S6-T04
        level: unit
        given: a registered job with no marker
        when: state is read
        then: it reads as in progress, and an unknown job as absent
      - id: S6-TF
        level: failure_injection
        given: a malformed marker
        when: it is read
        then: it is refused rather than partially trusted
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - Derived identity is asserted against the generation path's own function, not a literal.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: exempt
      detail: Introduces no store; the session registry is in-process and lost on restart, which is
        the deliberate alternative to a durable record of job identities with no retention clock.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
  - name: authorized-console-delivery-7-spec
    title: Delivery presigner Specification
    status: approved
    format: full
    capability: operator-console
    feature: authorized-console-delivery
    slice: 7
    source_story_ids:
      - operator-console/story/play-back-a-committed-video
      - operator-console/story/keep-console-credentials-out-of-the-browser
    purpose: 'Hand a browser a private object without proxying its bytes. Presigning is the only way
      to do that, so it is implemented rather than avoided, and implemented narrowly: one method, one
      immutable object, GET only, a lifetime the caller must state, and no capability to create, overwrite
      or delete.'
    layer_assignment:
      - component: SigV4Presigner
        layer: service
        responsibility: Issue read-only presigned URLs for one bucket in one reviewed region
      - component: LinkSigner port
        layer: integration
        responsibility: The existing delivery signing port this satisfies
    interfaces:
      - name: SigV4Presigner.presign_get
        kind: service_method
        signature: 'def presign_get(self, object_key: str, ttl_seconds: int) -> str'
        async: false
        ownership: The bucket, endpoint and region are fixed at construction, so a request varies the
          key and never the bucket.
      - name: SigV4Presigner.sign
        kind: port_implementation
        signature: 'async def sign(self, object_key: str, ttl_seconds: int) -> str'
        async: true
        ownership: Satisfies the delivery signing port; the computation is local, so the one-hour policy
          cap sits above this and narrows it.
    data_models:
      - name: presigned URL
        shape: returned value
        fields: path-style URL carrying algorithm, credential scope, date, expiry, signed headers and
          signature
        validation: path-style addressing keeps the bucket inside the signed path, so a key can never
          be read as a bucket
    behavior:
      - story_id: operator-console/story/play-back-a-committed-video
        given: a key, region, credential and instant
        when: a link is issued
        then: the URL matches the pinned vector, byte for byte with an independent implementation
      - story_id: operator-console/story/keep-console-credentials-out-of-the-browser
        given: an endpoint outside a reviewed Canadian region
        when: a presigner is constructed
        then: construction fails, rather than the first issued link failing
      - story_id: operator-console/story/play-back-a-committed-video
        given: a lifetime a signature cannot express
        when: a link is requested
        then: it is refused before the provider sees it
    error_handling:
      - condition: unreviewed_region_pair
        error: ValueError
        recovery: Refuse at construction, using the shared endpoint rule
        retryable: false
      - condition: unsignable_lifetime
        error: ValueError
        recovery: Refuse a lifetime outside the signable range
        retryable: false
    dependencies:
      required_slice_ids:
        - 1
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the delivery-read credential
        - the injected clock
      provides:
        - a short-lived read-only URL for one committed object
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - operator-console.authorized-console-delivery.7.started
        - operator-console.authorized-console-delivery.7.succeeded
        - operator-console.authorized-console-delivery.7.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - GET only. Nothing here can create, overwrite or delete, so the surface cannot alter the bucket
        through it.
      - The issued URL carries the credential identifier and a signature, so it is a secret for its
        lifetime and never enters a log, an error context or anything persisted.
      - Signing uses the standard library, because the delivery credential is the most sensitive value
        this process holds and hmac and hashlib are already in the trusted base.
    test_scenarios:
      - id: S7-T01
        level: unit
        given: the pinned credential, key, region, lifetime and instant
        when: a link is issued
        then: it equals the pinned vector
      - id: S7-T02
        level: unit
        given: a US endpoint or a US region
        when: a presigner is constructed
        then: construction fails naming the reviewed region
      - id: S7-T03
        level: unit
        given: a zero, negative or oversized lifetime
        when: a link is requested
        then: it is refused
      - id: S7-T04
        level: unit
        given: a lifetime beyond the delivery policy cap
        when: a link is issued through the policy
        then: the issued lifetime is the cap
      - id: S7-TF
        level: failure_injection
        given: each declared condition
        when: signing runs
        then: no signature or credential reaches a message
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - The signature is pinned against a vector verified against an independent implementation.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: bounded
      detail: 'Issues a value with a lifetime rather than storing one. The link is response-only: returned
        to the caller that asked, excluded from logs and error contexts by the existing forbidden-key
        rule, and expired by the delivery policy''s clock.'
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
