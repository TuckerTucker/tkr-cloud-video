  - name: authorized-console-delivery-9-spec
    title: Wire Authorized Console Delivery Specification
    status: approved
    format: full
    capability: operator-console
    feature: authorized-console-delivery
    slice: 9
    source_story_ids:
      - operator-console/story/play-back-a-committed-video
      - operator-console/story/detect-a-principal-mismatch
    purpose: Compose the delivery half and nothing beside it. Only the access policy, the signing service
      and the private result service are constructed here; the uploader, committer, reconciler and
      erasure path are absent rather than unused, which is the same reasoning the delivery composition
      already gives for making its retention store optional.
    layer_assignment:
      - component: compose_console
        layer: integration
        responsibility: Construct only the read and sign side of delivery
      - component: ConsoleService.delivery_link
        layer: service
        responsibility: Reauthorize, then issue one link for the committed video
      - component: ConsoleService.observe
        layer: service
        responsibility: Overlay the run's terminal status onto committed state
    interfaces:
      - name: compose_console
        kind: composition_root
        signature: def compose_console(settings, credentials, clock=None) -> ComposedConsole
        async: false
        ownership: Constructs no write-side service, so the capability is absent from the object graph
          rather than merely unexercised.
      - name: ConsoleService.delivery_link
        kind: service_method
        signature: 'async def delivery_link(self, job_id: str, ttl_seconds: int | None = None) -> dict[str,
          object]'
        async: true
        ownership: Reauthorizes at issue rather than inheriting the lookup that preceded it.
      - name: ConsoleService.observe
        kind: service_method
        signature: 'async def observe(self, run_id: str) -> dict[str, object]'
        async: true
        ownership: Reports the provider status and the handler response separately, because a run can
          complete carrying a request the worker refused.
    data_models:
      - name: delivery response
        shape: serialized mapping
        fields: job_id; url; expires_at
        validation: the URL is returned to the caller and is present in no log or error context
      - name: observation
        shape: serialized mapping
        fields: run_id; status; terminal; timings; handler; run; identity_matches; result_state
        validation: identity_matches is None when the worker reported no identity, false only on a
          real disagreement
    behavior:
      - story_id: operator-console/story/play-back-a-committed-video
        given: a committed result
        when: a link is requested
        then: one link is issued for the video role only
      - story_id: operator-console/story/play-back-a-committed-video
        given: a job with no committed video
        when: a link is requested
        then: nothing is signed and the outcome names it
      - story_id: operator-console/story/detect-a-principal-mismatch
        given: a worker job identity differing from the derived one
        when: a run is observed
        then: the mismatch is reported, because the console is computing keys for objects the worker
          never wrote
