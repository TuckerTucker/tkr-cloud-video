capability: operator-console
slice_specs:
  - name: local-generation-console-1-spec
    title: Console settings and credential boundary Specification
    status: approved
    format: full
    capability: operator-console
    feature: local-generation-console
    slice: 1
    source_story_ids:
      - operator-console/story/submit-a-validated-generation
      - operator-console/story/keep-console-credentials-out-of-the-browser
    purpose: 'Hold what the console is pointed at and what it holds, so neither can be wrong quietly.
      The bind address is constrained here rather than in the launch command because the surface authenticates
      nothing: on loopback the operating system has already answered who the caller is, and off loopback
      that answer is gone while two credentials remain.'
    layer_assignment:
      - component: ConsoleSettings
        layer: data
        responsibility: Validated non-secret configuration, loopback-constrained
      - component: ConsoleCredentials
        layer: data
        responsibility: The three secrets, held in a value that renders none of them
      - component: validate_canadian_b2_endpoint
        layer: domain
        responsibility: The one endpoint and region rule, shared with the storage adapter rather than
          copied
    interfaces:
      - name: ConsoleSettings
        kind: config_model
        signature: immutable pydantic model; extra=forbid, frozen
        async: false
        ownership: Refuses a non-loopback bind and a privileged port in validators, so an unsafe address
          cannot be reached by any launch path.
      - name: settings_from_environment
        kind: factory
        signature: 'def settings_from_environment(environment: Mapping[str, str]) -> ConsoleSettings'
        async: false
        ownership: Reads the mapping it is handed, never the ambient process environment, so no test
          depends on the machine it runs on.
      - name: credentials_from_environment
        kind: factory
        signature: 'def credentials_from_environment(environment: Mapping[str, str]) -> ConsoleCredentials'
        async: false
        ownership: Names every absent variable together; a message names variables and never values.
      - name: validate_canadian_b2_endpoint
        kind: domain_function
        signature: 'def validate_canadian_b2_endpoint(endpoint: str, region: str) -> None'
        async: false
        ownership: Checks the pair together, because either half alone is satisfiable while the transfer
          still leaves the country.
    data_models:
      - name: ConsoleSettings
        shape: immutable pydantic model
        fields: endpoint_id; principal_id; bucket_name; b2_s3_endpoint; b2_s3_region; signed_link_ttl_seconds;
          read_link_ttl_seconds; bind_host; bind_port; runpod_api_base; request_timeout_seconds
        validation: bind_host is loopback only; bind_port is zero or unprivileged; the storage pair
          names one reviewed Canadian region; link lifetimes are bounded
      - name: ConsoleCredentials
        shape: frozen dataclass with non-repr fields
        fields: runpod_api_key; delivery_key_id; delivery_application_key
        validation: every field is excluded from repr; an empty secret is refused at construction
    behavior:
      - story_id: operator-console/story/keep-console-credentials-out-of-the-browser
        given: a bind address that is not loopback
        when: settings are built
        then: construction fails, because the surface's whole authorization argument is the loopback
          address
      - story_id: operator-console/story/keep-console-credentials-out-of-the-browser
        given: a credential value
        when: it is rendered or logged
        then: no secret appears, because a credential in a traceback would be the entire failure
      - story_id: operator-console/story/submit-a-validated-generation
        given: an exported but empty variable
        when: settings are built
        then: the default applies, because an empty export is absence rather than a value
    error_handling:
      - condition: non_loopback_bind
        error: ValueError
        recovery: Refuse construction; there is no launch flag that overrides it
        retryable: false
      - condition: privileged_port
        error: ValueError
        recovery: Refuse; nothing about a single-operator tool wants that elevation
        retryable: false
      - condition: storage_pair_outside_reviewed_region
        error: ValueError
        recovery: Refuse the pair rather than either half
        retryable: false
      - condition: missing_or_empty_secret
        error: ValueError
        recovery: Name every absent variable and start nothing
        retryable: false
    dependencies:
      required_slice_ids: []
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the process environment as an explicit mapping
      provides:
        - validated console configuration
        - the three console secrets
        - the shared reviewed-region rule
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - operator-console.local-generation-console.1.started
        - operator-console.local-generation-console.1.succeeded
        - operator-console.local-generation-console.1.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - The surface may bind loopback only; the constraint lives in the settings so no operator command
        can widen it.
      - Secrets are read from the environment, so the console never learns how they are stored and
        the launcher stays the one thing that knows.
    test_scenarios:
      - id: S1-T01
        level: unit
        given: a non-loopback bind address
        when: settings are built
        then: construction fails naming loopback
      - id: S1-T02
        level: unit
        given: port 443 and port 0
        when: settings are built
        then: 443 is refused and 0 is accepted as an ephemeral request
      - id: S1-T03
        level: unit
        given: a US region and endpoint pair
        when: settings are built
        then: construction fails naming the reviewed region
      - id: S1-T04
        level: unit
        given: two absent secrets
        when: credentials are read
        then: both variables are named and no value appears
      - id: S1-TF
        level: failure_injection
        given: each declared condition at its boundary
        when: settings or credentials are built
        then: the recovery contract holds and no secret reaches a message, repr or log
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - No secret appears in any repr, str, message or event.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: exempt
      detail: Introduces no store; the session registry is in-process and lost on restart, which is
        the deliberate alternative to a durable record of job identities with no retention clock.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
  - name: local-generation-console-2-spec
    title: Local intake preflight Specification
    status: approved
    format: full
    capability: operator-console
    feature: local-generation-console
    slice: 2
    source_story_ids:
      - operator-console/story/refuse-a-defective-request-before-gpu-spend
      - operator-console/story/submit-a-validated-generation
    purpose: 'Run the worker''s own intake before anything is submitted. This is the single largest
      thing the surface does for the product: the same two steps in the same order, so a contract or
      prompt defect costs a round trip to this process rather than the model hydration the latency
      audit puts at about seven minutes.'
    layer_assignment:
      - component: preflight
        layer: domain
        responsibility: Parse the request contract, then compose and render the prompt
      - component: Accepted / Rejection
        layer: domain
        responsibility: One shape for what would happen, whichever way it goes
      - component: form_constraints
        layer: domain
        responsibility: Serve the pinned envelope and grammar tables as form bounds
    interfaces:
      - name: preflight
        kind: domain_function
        signature: 'def preflight(payload: object, prompts: PromptServices) -> Accepted | Rejection'
        async: false
        ownership: Calls the same two functions the handler calls, in the handler's order; agreement
          is pinned by test rather than by importing the handler, which would need an application this
          surface must not be given.
      - name: form_constraints
        kind: domain_function
        signature: def form_constraints() -> dict[str, Any]
        async: false
        ownership: Reads the registries, so a newly registered model set reaches the surface by being
          registered.
      - name: structured_example
        kind: domain_function
        signature: def structured_example() -> dict[str, Any]
        async: false
        ownership: Returns a packaged prompt that validates; pinned by test against the request file
          it came from so the two cannot drift.
    data_models:
      - name: Accepted
        shape: frozen dataclass
        fields: 'request: GenerationRequest; request_hash: str; wire_text: str; below_trained_envelope:
          bool'
        validation: wire_text is returned to the caller that supplied the prompt and to nothing else
      - name: Rejection
        shape: frozen dataclass
        fields: 'error_code: str; message: str; error_context: Mapping | None; defects: tuple[Mapping[str,
          str], ...]'
        validation: each defect carries field, rule and message; the offending value never crosses
    behavior:
      - story_id: operator-console/story/refuse-a-defective-request-before-gpu-spend
        given: a frame count off the model set's temporal grid
        when: preflight runs
        then: it is refused naming the grid, and the discriminator location is replaced by the request
      - story_id: operator-console/story/refuse-a-defective-request-before-gpu-spend
        given: a prompt beyond the bound the freeform field enforces
        when: preflight runs
        then: the bound is reported and the prompt text appears in no defect or payload
      - story_id: operator-console/story/submit-a-validated-generation
        given: a structured prompt
        when: preflight runs
        then: the rendered wire text is returned, because a structured prompt is derived rather than
          supplied
      - story_id: operator-console/story/submit-a-validated-generation
        given: a request naming no dimensions
        when: preflight runs
        then: they are filled from the trained envelope of the model set named
    error_handling:
      - condition: invalid_request
        error: Rejection
        recovery: Report every field-scoped defect together and submit nothing
        retryable: false
      - condition: prompt_validation_failed
        error: Rejection
        recovery: Carry the prompt error's own code and its full defect list rather than collapsing
          to invalid_request
        retryable: false
    dependencies:
      required_slice_ids:
        - 1
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the pinned trained-envelope registry
        - the composed prompt boundary
      provides:
        - a local accept-or-refuse decision matching the worker's
        - form bounds and closed vocabularies
        - the wire text a prompt renders to
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - operator-console.local-generation-console.2.started
        - operator-console.local-generation-console.2.succeeded
        - operator-console.local-generation-console.2.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - A defect names the field and the rule and carries the validator's own message; the value that
        caused it never crosses, because for a prompt field that value is the prompt.
      - The wire text is returned to the caller that supplied the prompt and is never logged.
    test_scenarios:
      - id: S2-T01
        level: unit
        given: a frame count off the grid
        when: preflight runs
        then: refused, located at the request, naming the grid
      - id: S2-T02
        level: unit
        given: a six thousand character prompt
        when: preflight runs
        then: the bound is reported and no prompt text appears in the payload
      - id: S2-T03
        level: unit
        given: a closed-vocabulary violation in a structured prompt
        when: preflight runs
        then: every defect is reported by field and rule
      - id: S2-T04
        level: unit
        given: the packaged structured example
        when: preflight runs
        then: it is accepted and equals the request file it came from
      - id: S2-TF
        level: failure_injection
        given: each declared condition
        when: preflight runs
        then: the shape is identical to the handler's rejection
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - Agreement with the handler is asserted across the request matrix, not merely for the happy
        path.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: exempt
      detail: Introduces no store; the session registry is in-process and lost on restart, which is
        the deliberate alternative to a durable record of job identities with no retention clock.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
  - name: local-generation-console-3-spec
    title: Serverless run client Specification
    status: approved
    format: full
    capability: operator-console
    feature: local-generation-console
    slice: 3
    source_story_ids:
      - operator-console/story/follow-a-run-to-a-terminal-state
    purpose: Submit and observe a run without holding a connection open for it. Submission is asynchronous
      by construction and never synchronous, because a cold worker hydrates the full model set before
      it accepts work and the recorded runs took twelve and twenty-five minutes end to end.
    layer_assignment:
      - component: RunClient
        layer: service
        responsibility: The port the console composes against
      - component: RunPodRunClient
        layer: integration
        responsibility: The provider adapter for the run routes
      - component: RunStatus
        layer: service
        responsibility: One observation, separating provider state from handler response
    interfaces:
      - name: RunClient
        kind: port
        signature: async def submit(payload) -> str; async def status(run_id) -> RunStatus; async def
          cancel(run_id) -> str
        async: true
        ownership: Injected, so the surface is exercised end to end without a provider.
      - name: RunPodRunClient
        kind: integration_adapter
        signature: 'def __init__(self, settings: ConsoleSettings, credentials: ConsoleCredentials)'
        async: false
        ownership: Scoped to one endpoint at construction; a request varies the run, never the endpoint.
      - name: EndpointPausedError
        kind: typed_error
        signature: 'code: str; safe_message: str; retryable: bool; context: Mapping[str, str]'
        async: false
        ownership: 'A distinct type because a paused endpoint is a state to wait out, not a failure:
          raising a worker ceiling reaches the configuration plane before the run plane.'
    data_models:
      - name: RunStatus
        shape: frozen dataclass
        fields: 'run_id: str; status: str; output: dict | None; error: str | None; delay_time_ms: int
          | None; execution_time_ms: int | None'
        validation: terminal is derived from the status set rather than stored; timings are dropped
          when unusable, so a boolean is never read as one millisecond
    behavior:
      - story_id: operator-console/story/follow-a-run-to-a-terminal-state
        given: a submission
        when: it is sent
        then: it goes to the asynchronous run route and returns a run identifier
      - story_id: operator-console/story/follow-a-run-to-a-terminal-state
        given: a paused endpoint
        when: a submission is attempted
        then: a distinct retryable state is raised rather than a failure
      - story_id: operator-console/story/follow-a-run-to-a-terminal-state
        given: a provider answering without a run identifier
        when: a submission completes
        then: it is refused, because there is nothing left to poll
    error_handling:
      - condition: endpoint_paused
        error: EndpointPausedError
        recovery: Report as a state to wait out; the caller may retry unchanged
        retryable: true
      - condition: provider_call_failed
        error: AppError
        recovery: Report with the status class; five-hundreds are retryable
        retryable: true
      - condition: provider_response_invalid
        error: AppError
        recovery: Refuse a document that is not an object or names no status
        retryable: false
    dependencies:
      required_slice_ids:
        - 1
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the Serverless run, status and cancel routes
      provides:
        - a submitted run identifier
        - one observation of a run
        - cancellation of a run this console started
      documented_routes: []
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - operator-console.local-generation-console.3.started
        - operator-console.local-generation-console.3.succeeded
        - operator-console.local-generation-console.3.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - The bearer credential reaches the provider and appears in no response, log or error context.
      - Response bodies are read under a ceiling, so a provider answer cannot stream unbounded into
        the process.
    test_scenarios:
      - id: S3-T01
        level: unit
        given: a submission
        when: it is sent
        then: the asynchronous route is used and the envelope is unchanged
      - id: S3-T02
        level: unit
        given: a paused endpoint response
        when: a submission is attempted
        then: EndpointPausedError is raised and is retryable
      - id: S3-T03
        level: unit
        given: a status carrying a boolean timing
        when: it is observed
        then: the timing is dropped rather than coerced
      - id: S3-T04
        level: unit
        given: a transport failure
        when: a status is requested
        then: the error is retryable
      - id: S3-TF
        level: failure_injection
        given: each declared condition
        when: a route is called
        then: the recovery contract holds and the credential never appears
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - The credential is asserted present on the request and absent from every rendering.
      - No placeholder, TODO, mutable dependency reference, or console-only error remains.
    data_lifecycle:
      kind: exempt
      detail: Introduces no store; the session registry is in-process and lost on restart, which is
        the deliberate alternative to a durable record of job identities with no retention clock.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, explicit exception wrapping
        with domain context.
      logging: structlog only; allowlisted fields, never a credential, signed URL, prompt body or caller
        filename.
      bash: n/a
      testing: pytest with deterministic fakes for every side-effecting port.
  - name: local-generation-console-4-spec
    title: Wire Local Generation Console Specification
    status: approved
    format: full
    capability: operator-console
    feature: local-generation-console
    slice: 4
    source_story_ids:
      - operator-console/story/submit-a-validated-generation
      - operator-console/story/follow-a-run-to-a-terminal-state
    purpose: Join the preflight, the run client and the page into one surface, keeping routing independent
      of any socket so the whole API is exercised as function calls and the server stays small enough
      to read in one sitting, which matters for a process holding two credentials.
    layer_assignment:
      - component: dispatch
        layer: integration
        responsibility: Route one request to the console service, independent of any socket
      - component: ConsoleRequestHandler
        layer: integration
        responsibility: The loopback socket shell and its fixed security headers
      - component: ConsoleService
        layer: service
        responsibility: The use cases the routes call
      - component: static page
        layer: integration
        responsibility: The form, the live preflight, the wire text and the run cards
    interfaces:
      - name: dispatch
        kind: integration_function
        signature: 'async def dispatch(service: ConsoleService, method: str, path: str, body: bytes)
          -> Response'
        async: true
        ownership: Pure with respect to sockets; an application error becomes an error document rather
          than a traceback, because the page renders every failure the same way.
      - name: content_security_policy
        kind: integration_function
        signature: 'def content_security_policy(media_origin: str) -> str'
        async: false
        ownership: 'Written around the fact that the page holds a delivery URL: the only permitted
          cross-origin load is the video itself.'
      - name: build_server
        kind: integration_factory
        signature: 'def build_server(console: ComposedConsole) -> ThreadingHTTPServer'
        async: false
        ownership: Binding is separated from serving so a caller can bind an ephemeral port.
      - name: run_console
        kind: cli_entrypoint
        signature: 'def run_console(port: int | None = None) -> int'
        async: false
        ownership: Exits rather than serving when configuration is incomplete.
    data_models:
      - name: Response
        shape: frozen dataclass
        fields: 'status: int; body: bytes; content_type: str; headers: Mapping[str, str]'
        validation: every response is served no-store, because preflight echoes the wire text and delivery
          carries a signed URL
    behavior:
      - story_id: operator-console/story/submit-a-validated-generation
        given: a valid request
        when: it is posted to the generate route
        then: it is preflighted, then submitted, and its derived identity is recorded
      - story_id: operator-console/story/follow-a-run-to-a-terminal-state
        given: a run identifier
        when: its route is polled
        then: the provider status and the handler response are reported separately
      - story_id: operator-console/story/submit-a-validated-generation
        given: a request naming an unexpected host
        when: it arrives
        then: it is refused before it reaches a route
    error_handling:
      - condition: request_too_large
        error: AppError
        recovery: Refuse at the socket and again in the router
        retryable: false
      - condition: invalid_envelope
        error: AppError
        recovery: Report a body that is not JSON as a named error document
        retryable: false
      - condition: not_found
        error: routing failure
        recovery: Answer an unknown route as an error document the page can render
        retryable: false
      - condition: host_not_permitted
        error: routing failure
        recovery: Refuse a request whose Host is not this loopback server
        retryable: false
    dependencies:
      required_slice_ids:
        - 2
        - 3
      external:
        - Python standard library
      inversion_of_control: Every side-effecting collaborator is a Protocol dependency supplied by
        the capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - the local preflight
        - the run port
      provides:
        - a submitted and observable generation
        - the operator page and its assets
      documented_routes:
        - GET /
        - GET /app.css
        - GET /app.js
        - GET /api/constraints
        - GET /api/scope
        - GET /api/history
        - POST /api/preflight
        - POST /api/generate
        - GET /api/runs/{run_id}
        - POST /api/runs/{run_id}/cancel
        - GET /api/jobs/{job_id}/result
        - POST /api/jobs/{job_id}/link
      reference_documentation: []
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
    observability:
      events:
        - operator-console.local-generation-console.4.started
        - operator-console.local-generation-console.4.succeeded
        - operator-console.local-generation-console.4.failed
      required_fields:
        - event
        - outcome
        - duration_ms
        - error_code?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - user-supplied filenames
      logging_contract: No access log is kept. Request lines name job identities and would sit beside
        the response that issued a signed link.
    security_constraints:
      - Validate at the boundary and pass typed values inward.
      - No global clients or ambient credentials; every collaborator is injected.
      - Fail closed on configuration, authorization and digest uncertainty.
      - The Host header is checked, because a browser resolves any name to any address and this surface
        authenticates nothing.
      - 'No access log is kept: a request line names the job and would sit beside the response that
        issued a link.'
      - Static assets are served by exact name; no request path is mapped onto the filesystem.
    test_scenarios:
      - id: S4-T01
        level: integration
        given: each static path
        when: it is requested
        then: the asset is served and a traversal path is not
      - id: S4-T02
        level: integration
        given: a wrong method on a served path
        when: it is requested
        then: the method is refused as an error document
      - id: S4-T03
        level: integration
        given: a rebound Host header
        when: a request arrives
        then: it is refused before routing
      - id: S4-T04
        level: integration
        given: an oversized body
        when: it is posted
        then: it is refused at the socket and in the router
      - id: S4-TF
        level: failure_injection
        given: each declared condition
        when: a request is dispatched
        then: an error document is produced, never a traceback
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability classification.
      - The served security headers are asserted on a real socket, not only in the router.
