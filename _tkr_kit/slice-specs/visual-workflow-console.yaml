      kind: exempt
      detail: Tests use synthetic values and teardown-cleared local stores. Semantic
        failure artifacts exclude prompt content, screenshots with user data and signed links.
    implementation_constraints:
      python: Harness adapters follow PEP 8/484 and Google-style docstrings with explicit cleanup.
      typescript: Strict ES modules, named exports, explicit return types and handled browser promises.
      logging: pino and structlog captures are scanned for forbidden fields and never serve as sole error UI.
      bash: Test orchestration is Bash 3.2-compatible when shell wrapping is needed.
      testing: Deterministic browser/server fakes, semantic accessibility assertions and failure-safe teardown.
