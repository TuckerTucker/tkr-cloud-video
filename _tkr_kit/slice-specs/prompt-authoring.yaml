  - name: structured-prompt-contract-3-spec
    title: Structural prompt validator Specification
    status: approved
    format: full
    capability: prompt-authoring
    feature: structured-prompt-contract
    slice: 3
    source_story_ids:
      - prompt-authoring/story/reject-a-structurally-invalid-prompt
      - prompt-authoring/story/resolve-reference-labels-across-sections
    purpose: Implement Structural prompt validator as the domain contract that
      timeline checks for monotonic shot numbering, strictly increasing cut
      times, and cut times inside the requested clip duration.
    layer_assignment:
      - component: StructuralPromptValidatorPolicy
        layer: domain
        responsibility: Timeline checks for monotonic shot numbering, strictly
          increasing cut times, and cut times inside the requested clip duration
      - component: injected ports/adapters
        layer: integration
        responsibility: Provide clock, hashing, filesystem, and telemetry effects
          without coupling prompt policy to providers
    interfaces:
      - name: StructuralPromptValidatorPolicy
        kind: policy_or_domain_service
        signature: "def execute(self, request: StructuralPromptValidatorRequest,
          context: OperationContext) -> StructuralPromptValidatorResult"
        async: false
        ownership: The capability composition root constructs the implementation and
          injects all side-effecting ports.
      - name: StructuralPromptValidatorError
        kind: typed_error
        signature: "code: str; safe_message: str; retryable: bool; context: Mapping[str,
          str]"
        async: false
        ownership: Carries allowlisted diagnostic context only; never the prompt body,
          caller dialogue, or on-screen text.
    data_models:
      - name: StructuralPromptValidatorRequest
        shape: immutable Pydantic model
        fields: Only the typed prompt sections, mode discriminator, requested duration,
          and grammar revision required by this operation.
        validation: forbid unknown fields; reject control characters; caller-supplied
          spans are typed distinctly from service-authored description
      - name: StructuralPromptValidatorResult
        shape: frozen dataclass or Pydantic model
        fields: Timeline checks for monotonic shot numbering, strictly increasing cut
          times, and cut times inside the requested clip duration,
          Reference-label resolution reporting dangling uses, unused
          definitions, and labels introduced outside the definitions section,
          Delimiter balance and speaker-identifier continuity checks, and typed
          field-scoped errors whose context carries no prompt body, A declared
          per-mode check inventory returned with every result, naming the checks
          the submitted mode did not exercise
        validation: must be complete before return; no secret, signed URL token, prompt
          body, caller dialogue, or user filename fields
      - name: OperationContext
        shape: frozen dataclass
        fields:
          - release_id
          - worker_id
          - correlation_id
          - job_id?
          - attempt_id?
          - deadline
        validation: safe identifiers only; cancellation/deadline propagated to every
          adapter
    behavior:
      - story_id: prompt-authoring/story/reject-a-structurally-invalid-prompt
        given: a six-second clip declares a shot cutting at 00:07.000
        when: validation runs
        then: the prompt is rejected naming the shot and the duration bound, and no job
          is created
      - story_id: prompt-authoring/story/reject-a-structurally-invalid-prompt
        given: a shot opens a dialogue delimiter and never closes it
        when: validation runs
        then: the prompt is rejected naming the shot, and the error context carries no
          dialogue text
      - story_id: prompt-authoring/story/reject-a-structurally-invalid-prompt
        given: a prompt passes every applicable check
        when: validation returns
        then: the result enumerates the checks skipped as not applicable to the
          submitted mode
      - story_id: prompt-authoring/story/resolve-reference-labels-across-sections
        given: the detailed description cites a subject label that no definition
          introduces
        when: label resolution runs
        then: the prompt is rejected naming the label and the section that used it
      - story_id: prompt-authoring/story/resolve-reference-labels-across-sections
        given: the summary section introduces a label absent from the definitions
        when: label resolution runs
        then: the prompt is rejected, because only the definitions section may introduce
          labels
      - story_id: prompt-authoring/story/resolve-reference-labels-across-sections
        given: a defined audio label is bound to a target speaker identifier
        when: the retention section is checked
        then: the speaker identifier is absent from retention and the audio label
          carries a relationship marker from the closed set
    error_handling:
      - condition: shot_timeline_invalid
        error: PromptValidationError
        recovery: Reject naming the shot and the rule broken, before any input transfer
          or GPU allocation
        retryable: false
      - condition: reference_label_unresolved
        error: PromptValidationError
        recovery: Reject naming the dangling label and the section that used it
        retryable: false
      - condition: delimiter_unbalanced
        error: PromptValidationError
        recovery: Reject naming the shot; the error context carries no dialogue text
        retryable: false
    dependencies:
      required_slice_ids:
        - prompt-authoring/slice/2
      external:
        - Python standard library
        - pydantic
        - structlog
      inversion_of_control: All side effects are Protocol dependencies supplied by the
