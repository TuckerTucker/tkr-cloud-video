    capability: prompt-authoring
    feature: structured-prompt-contract
    slice: 4
    source_story_ids:
      - prompt-authoring/story/reject-a-structurally-invalid-prompt
    purpose: Implement Wire Structured Prompt Contract as the integration contract
      that a composition root that constructs the validator over injected
      grammar tables and clock.
    layer_assignment:
      - component: compose_structured_prompt_contract
        layer: integration
        responsibility: IoC composition of all Structured Prompt Contract components and
          adapters
      - component: injected ports/adapters
        layer: integration
        responsibility: Provide clock, hashing, filesystem, and telemetry effects
          without coupling prompt policy to providers
    interfaces:
      - name: WireStructuredPromptContractPolicy
        kind: policy_or_domain_service
        signature: "def execute(self, request: WireStructuredPromptContractRequest,
          context: OperationContext) -> WireStructuredPromptContractResult"
        async: false
        ownership: The capability composition root constructs the implementation and
          injects all side-effecting ports.
      - name: WireStructuredPromptContractError
        kind: typed_error
        signature: "code: str; safe_message: str; retryable: bool; context: Mapping[str,
          str]"
        async: false
        ownership: Carries allowlisted diagnostic context only; never the prompt body,
          caller dialogue, or on-screen text.
    data_models:
      - name: WireStructuredPromptContractRequest
        shape: immutable Pydantic model
        fields: Only the typed prompt sections, mode discriminator, requested duration,
          and grammar revision required by this operation.
        validation: forbid unknown fields; reject control characters; caller-supplied
          spans are typed distinctly from service-authored description
      - name: WireStructuredPromptContractResult
        shape: frozen dataclass or Pydantic model
        fields: A composition root that constructs the validator over injected grammar
          tables and clock, Typed error registration and structlog event wiring
          with the prompt body structurally excluded, Grammar digest
          verification surfaced through the existing credential-free diagnostic
          entrypoint
        validation: must be complete before return; no secret, signed URL token, prompt
          body, caller dialogue, or user filename fields
      - name: OperationContext
        shape: frozen dataclass
        fields:
          - release_id
          - worker_id
          - correlation_id
          - job_id?
          - attempt_id?
          - deadline
        validation: safe identifiers only; cancellation/deadline propagated to every
          adapter
    behavior:
      - story_id: prompt-authoring/story/reject-a-structurally-invalid-prompt
        given: a six-second clip declares a shot cutting at 00:07.000
        when: validation runs
        then: the prompt is rejected naming the shot and the duration bound, and no job
          is created
      - story_id: prompt-authoring/story/reject-a-structurally-invalid-prompt
        given: a shot opens a dialogue delimiter and never closes it
        when: validation runs
        then: the prompt is rejected naming the shot, and the error context carries no
          dialogue text
      - story_id: prompt-authoring/story/reject-a-structurally-invalid-prompt
        given: a prompt passes every applicable check
        when: validation returns
        then: the result enumerates the checks skipped as not applicable to the
          submitted mode
    error_handling:
      - condition: dependency_missing
        error: CompositionError
        recovery: Fail composition before exposing the prompt boundary
        retryable: false
      - condition: grammar_revision_unloadable
        error: PromptGrammarIntegrityError
        recovery: Report the revision through the diagnostic entrypoint and keep the
          boundary closed
        retryable: false
      - condition: configuration_invalid
        error: RuntimeConfigurationError
        recovery: Aggregate safe validation defects
        retryable: false
    dependencies:
      required_slice_ids:
        - prompt-authoring/slice/1
        - prompt-authoring/slice/2
        - prompt-authoring/slice/3
      external:
        - Python standard library
        - pydantic
        - structlog
      inversion_of_control: All side effects are Protocol dependencies supplied by the
        capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - pinned grammar tables, product configuration, and injected platform
          ports
      provides:
        - A composition root that constructs the validator over injected grammar
          tables and clock
        - Typed error registration and structlog event wiring with the prompt
          body structurally excluded
        - Grammar digest verification surfaced through the existing
          credential-free diagnostic entrypoint
      documented_routes: []
      reference_documentation:
        - See prompt-authoring.source_documents for the pinned upstream grammar
          of record; do not restate the commit here.
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
      - name: PROMPT_GRAMMAR_REVISION
        type: string
        default: h3-2026-08
        secret: false
        validation: must match a shipped revision whose table digest verifies at load
      - name: SCHEMA_VERSION
        type: string
        default: "1"
        secret: false
        validation: supported version only
    observability:
      events:
        - prompt-authoring.structured-prompt-contract.4.started
        - prompt-authoring.structured-prompt-contract.4.succeeded
        - prompt-authoring.structured-prompt-contract.4.failed
      required_fields:
        - event
        - release_id
        - worker_id
        - correlation_id
        - duration_ms
        - outcome
        - error_code?
        - prompt_mode?
        - grammar_revision?
        - job_id?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - composed prompt bodies
        - caller dialogue, lyrics, and on-screen text
        - user-supplied filenames
      logging_contract: Use structlog JSON. Emit state changes and rejections once at
        the owning boundary; a rejection names the field and the rule, never the
        offending text.
    security_constraints:
      - Caller-supplied dialogue, lyrics, and on-screen text are data, never
        grammar; they are contained at the render boundary and may not open a
        shot, a section, or a delimiter.
      - Validate at the boundary and pass typed values inward; never rebuild
        wire text from unchecked strings.
      - No global clients or ambient credentials; the prompt boundary receives
        the minimum dependency set.
      - Fail closed on grammar integrity, label resolution, containment, and
        digest uncertainty.
    test_scenarios:
      - id: S4-T01
        level: unit
        given: a six-second clip declares a shot cutting at 00:07.000
        when: validation runs
        then: the prompt is rejected naming the shot and the duration bound, and no job
          is created
      - id: S4-T02
        level: unit
        given: a shot opens a dialogue delimiter and never closes it
        when: validation runs
        then: the prompt is rejected naming the shot, and the error context carries no
          dialogue text
      - id: S4-T03
        level: unit
        given: a prompt passes every applicable check
        when: validation returns
        then: the result enumerates the checks skipped as not applicable to the
          submitted mode
      - id: S4-TF
        level: failure_injection
        given: each declared error condition is injected at its owning boundary
        when: Wire Structured Prompt Contract runs
        then: the recovery and retryability contract is observed and no wire text,
          event, or committed field carries the prompt body
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported
        return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability
        classification.
      - Structured events cover entry, success, failure, and material state
        transitions without sensitive fields.
      - Unit and adapter-contract tests pass; integration coverage exercises the
        linked stories.
      - No placeholder, TODO, mutable dependency reference, or console-only
        error remains.
    data_lifecycle:
      kind: exempt
      detail: Introduces no store. The grammar tables, typed models, validators, and
        renderer are pure in-process values constructed per request and
        discarded with the request; no writer exists that persists them.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, and
        explicit exception wrapping with domain context.
      logging: structlog only for application events; the composed prompt body and
        caller text are structurally excluded from every event.
      bash: Any entrypoint or helper remains Bash 3.2 compatible and delegates policy
        to typed Python code.
      testing: pytest parametrization for scenario tables; fakes implement the same
        Protocols as production adapters, injected at the constructor.
