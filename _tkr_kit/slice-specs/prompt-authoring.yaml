        type: string
        default: h3-2026-08
        secret: false
        validation: must match a shipped revision whose table digest verifies at load
      - name: SCHEMA_VERSION
        type: string
        default: "1"
        secret: false
        validation: supported version only
    observability:
      events:
        - prompt-authoring.structured-prompt-contract.3.started
        - prompt-authoring.structured-prompt-contract.3.succeeded
        - prompt-authoring.structured-prompt-contract.3.failed
      required_fields:
