    format: full
    capability: prompt-authoring
    feature: pinned-prompt-rendering
    slice: 10
    source_story_ids:
      - prompt-authoring/story/render-a-prompt-deterministically
      - prompt-authoring/story/contain-untrusted-caller-text
      - prompt-authoring/story/pin-and-record-the-grammar-revision
    purpose: Implement Test Pinned Prompt Rendering as the integration contract that
      a cross-process determinism test asserting byte-identical wire text and
      matching digests.
    layer_assignment:
      - component: test_pinned_prompt_rendering
        layer: integration
        responsibility: Table-driven unit coverage for Pinned Prompt Rendering domain contracts
      - component: injected ports/adapters
        layer: integration
        responsibility: Provide clock, hashing, filesystem, and telemetry effects
          without coupling prompt policy to providers
    interfaces:
      - name: TestPinnedPromptRenderingPolicy
        kind: policy_or_domain_service
        signature: "def execute(self, request: TestPinnedPromptRenderingRequest,
          context: OperationContext) -> TestPinnedPromptRenderingResult"
        async: false
        ownership: The capability composition root constructs the implementation and
          injects all side-effecting ports.
      - name: TestPinnedPromptRenderingError
        kind: typed_error
        signature: "code: str; safe_message: str; retryable: bool; context: Mapping[str,
          str]"
        async: false
        ownership: Carries allowlisted diagnostic context only; never the prompt body,
          caller dialogue, or on-screen text.
    data_models:
      - name: TestPinnedPromptRenderingRequest
        shape: immutable Pydantic model
        fields: Only the typed prompt sections, mode discriminator, requested duration,
          and grammar revision required by this operation.
        validation: forbid unknown fields; reject control characters; caller-supplied
          spans are typed distinctly from service-authored description
      - name: TestPinnedPromptRenderingResult
        shape: frozen dataclass or Pydantic model
        fields: A cross-process determinism test asserting byte-identical wire text and
          matching digests, Containment tests driving a closing delimiter, a
          shot header, and a field name through caller dialogue, each rejected
          with no wire text produced, An end-to-end intake test proving a
          structured prompt reaches the workflow binder and its digest and
          grammar revision reach reproducibility metadata, A redaction test
          asserting no event or result field carries the prompt body or caller
          dialogue
        validation: must be complete before return; no secret, signed URL token, prompt
          body, caller dialogue, or user filename fields
      - name: OperationContext
        shape: frozen dataclass
        fields:
          - release_id
          - worker_id
          - correlation_id
          - job_id?
          - attempt_id?
          - deadline
        validation: safe identifiers only; cancellation/deadline propagated to every
          adapter
    behavior:
      - story_id: prompt-authoring/story/render-a-prompt-deterministically
        given: the same structured prompt is rendered in two separate processes
        when: the outputs are compared
        then: the wire text is byte-identical and both digests match
      - story_id: prompt-authoring/story/render-a-prompt-deterministically
        given: a camera motion declares medium amplitude and normal speed
        when: the shot is rendered
        then: the modifiers are omitted rather than written out, matching the grammar's
          declared default
      - story_id: prompt-authoring/story/render-a-prompt-deterministically
        given: a prompt declares no non-diegetic music
        when: the section is rendered
        then: the defined absent-value token is emitted rather than an empty or missing
          section
      - story_id: prompt-authoring/story/contain-untrusted-caller-text
        given: caller dialogue contains a closing dialogue delimiter
        when: rendering runs
        then: the prompt is rejected and no wire text is produced
      - story_id: prompt-authoring/story/contain-untrusted-caller-text
        given: caller dialogue contains text that reads as a shot header or a field name
        when: rendering runs
        then: the prompt is rejected, because a caller span may never open a shot or a
          section
      - story_id: prompt-authoring/story/contain-untrusted-caller-text
        given: caller on-screen text is supplied in a non-Latin script
        when: rendering runs
        then: the text appears in the wire text unchanged and untranslated
      - story_id: prompt-authoring/story/contain-untrusted-caller-text
        given: a containment rejection is logged
        when: the event is emitted
        then: the event names the field and the rule and carries no caller text
      - story_id: prompt-authoring/story/pin-and-record-the-grammar-revision
        given: a job commits successfully
        when: the result manifest is read
        then: it carries the prompt digest and the pinned grammar revision and digest
      - story_id: prompt-authoring/story/pin-and-record-the-grammar-revision
        given: the grammar tables change
        when: the revision digest is recomputed
        then: it differs from the previously recorded digest and the mismatch is
          detectable at load
      - story_id: prompt-authoring/story/pin-and-record-the-grammar-revision
        given: a result manifest is inspected by an operator
        when: its fields are read
        then: no prompt body, dialogue, or caller filename is present
    error_handling:
      - condition: test_fixture_invalid
        error: TestContractError
        recovery: Fail the suite before exercising production behavior
        retryable: false
      - condition: expected_failure_not_observed
        error: AssertionError
        recovery: Report the discriminating scenario and captured safe evidence
        retryable: false
      - condition: environment_unavailable
        error: TestEnvironmentError
        recovery: Mark the environment-dependent case blocked, not passed
        retryable: true
    dependencies:
      required_slice_ids:
        - prompt-authoring/slice/9
      external:
        - Python standard library
        - pydantic
        - structlog
      inversion_of_control: All side effects are Protocol dependencies supplied by the
        capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - pinned grammar tables, product configuration, and injected platform
          ports
      provides:
        - A cross-process determinism test asserting byte-identical wire text
          and matching digests
        - Containment tests driving a closing delimiter, a shot header, and a
          field name through caller dialogue, each rejected with no wire text
          produced
        - An end-to-end intake test proving a structured prompt reaches the
          workflow binder and its digest and grammar revision reach
          reproducibility metadata
        - A redaction test asserting no event or result field carries the prompt
          body or caller dialogue
      documented_routes: []
      reference_documentation:
        - See prompt-authoring.source_documents for the pinned upstream grammar
          of record; do not restate the commit here.
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
      - name: PROMPT_GRAMMAR_REVISION
        type: string
        default: h3-2026-08
        secret: false
        validation: must match a shipped revision whose table digest verifies at load
      - name: SCHEMA_VERSION
        type: string
        default: "1"
        secret: false
        validation: supported version only
    observability:
      events:
        - prompt-authoring.pinned-prompt-rendering.10.started
        - prompt-authoring.pinned-prompt-rendering.10.succeeded
        - prompt-authoring.pinned-prompt-rendering.10.failed
      required_fields:
        - event
        - release_id
        - worker_id
        - correlation_id
        - duration_ms
        - outcome
        - error_code?
        - prompt_mode?
        - grammar_revision?
        - job_id?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - composed prompt bodies
        - caller dialogue, lyrics, and on-screen text
        - user-supplied filenames
      logging_contract: Use structlog JSON. Emit state changes and rejections once at
        the owning boundary; a rejection names the field and the rule, never the
        offending text.
    security_constraints:
      - Caller-supplied dialogue, lyrics, and on-screen text are data, never
        grammar; they are contained at the render boundary and may not open a
        shot, a section, or a delimiter.
      - Validate at the boundary and pass typed values inward; never rebuild
        wire text from unchecked strings.
      - No global clients or ambient credentials; the prompt boundary receives
        the minimum dependency set.
      - Fail closed on grammar integrity, label resolution, containment, and
        digest uncertainty.
    test_scenarios:
      - id: S10-T01
        level: unit
        given: the same structured prompt is rendered in two separate processes
        when: the outputs are compared
        then: the wire text is byte-identical and both digests match
      - id: S10-T02
        level: unit
        given: a camera motion declares medium amplitude and normal speed
        when: the shot is rendered
        then: the modifiers are omitted rather than written out, matching the grammar's
          declared default
      - id: S10-T03
        level: unit
        given: a prompt declares no non-diegetic music
        when: the section is rendered
        then: the defined absent-value token is emitted rather than an empty or missing
          section
      - id: S10-T04
        level: unit
        given: caller dialogue contains a closing dialogue delimiter
        when: rendering runs
        then: the prompt is rejected and no wire text is produced
      - id: S10-T05
        level: unit
        given: caller dialogue contains text that reads as a shot header or a field name
        when: rendering runs
        then: the prompt is rejected, because a caller span may never open a shot or a
          section
      - id: S10-T06
        level: unit
        given: caller on-screen text is supplied in a non-Latin script
        when: rendering runs
        then: the text appears in the wire text unchanged and untranslated
      - id: S10-T07
        level: unit
        given: a containment rejection is logged
        when: the event is emitted
        then: the event names the field and the rule and carries no caller text
      - id: S10-T08
        level: unit
        given: a job commits successfully
        when: the result manifest is read
        then: it carries the prompt digest and the pinned grammar revision and digest
      - id: S10-T09
        level: unit
        given: the grammar tables change
        when: the revision digest is recomputed
        then: it differs from the previously recorded digest and the mismatch is
          detectable at load
      - id: S10-T10
        level: unit
        given: a result manifest is inspected by an operator
        when: its fields are read
        then: no prompt body, dialogue, or caller filename is present
      - id: S10-TF
        level: failure_injection
        given: each declared error condition is injected at its owning boundary
        when: Test Pinned Prompt Rendering runs
        then: the recovery and retryability contract is observed and no wire text,
          event, or committed field carries the prompt body
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported
        return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability
        classification.
      - Structured events cover entry, success, failure, and material state
        transitions without sensitive fields.
      - Unit and adapter-contract tests pass; integration coverage exercises the
        linked stories.
      - No placeholder, TODO, mutable dependency reference, or console-only
        error remains.
    data_lifecycle:
      kind: exempt
      detail: Introduces no store. Fixtures and rendered comparison text are built
        inside a per-test temporary directory removed by the test runner; no
        writer persists beyond the run.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, and
        explicit exception wrapping with domain context.
      logging: structlog only for application events; the composed prompt body and
        caller text are structurally excluded from every event.
      bash: Any entrypoint or helper remains Bash 3.2 compatible and delegates policy
        to typed Python code.
      testing: pytest parametrization for scenario tables; fakes implement the same
        Protocols as production adapters, injected at the constructor.
