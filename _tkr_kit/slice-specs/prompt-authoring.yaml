capability: prompt-authoring
slice_specs:
  - name: structured-prompt-contract-1-spec
    title: Pinned prompt grammar tables Specification
    status: approved
    format: full
    capability: prompt-authoring
    feature: structured-prompt-contract
    slice: 1
    source_story_ids:
      - prompt-authoring/story/compose-a-mode-correct-h3-prompt
    purpose: Implement Pinned prompt grammar tables as the data contract that frozen
      vocabulary tables for camera motion type, amplitude, and speed, cut
      phrasing, retention relationship markers, and task-type prefixes, each
      with its declared default.
    layer_assignment:
      - component: PinnedPromptGrammarTablesPolicy
        layer: data
        responsibility: Frozen vocabulary tables for camera motion type, amplitude, and
          speed, cut phrasing, retention relationship markers, and task-type
          prefixes, each with its declared default
      - component: injected ports/adapters
        layer: integration
        responsibility: Provide clock, hashing, filesystem, and telemetry effects
          without coupling prompt policy to providers
    interfaces:
      - name: PinnedPromptGrammarTablesPolicy
        kind: policy_or_domain_service
        signature: "def execute(self, request: PinnedPromptGrammarTablesRequest,
          context: OperationContext) -> PinnedPromptGrammarTablesResult"
        async: false
        ownership: The capability composition root constructs the implementation and
          injects all side-effecting ports.
      - name: PinnedPromptGrammarTablesError
        kind: typed_error
        signature: "code: str; safe_message: str; retryable: bool; context: Mapping[str,
          str]"
        async: false
        ownership: Carries allowlisted diagnostic context only; never the prompt body,
          caller dialogue, or on-screen text.
    data_models:
      - name: PinnedPromptGrammarTablesRequest
        shape: immutable Pydantic model
        fields: Only the typed prompt sections, mode discriminator, requested duration,
          and grammar revision required by this operation.
        validation: forbid unknown fields; reject control characters; caller-supplied
          spans are typed distinctly from service-authored description
      - name: PinnedPromptGrammarTablesResult
        shape: frozen dataclass or Pydantic model
        fields: Frozen vocabulary tables for camera motion type, amplitude, and speed,
          cut phrasing, retention relationship markers, and task-type prefixes,
          each with its declared default, A grammar revision identifier and
          content digest computed over the tables, verified at load, The
          published JSON Schema describing the structured H3 prompt for external
          callers
        validation: must be complete before return; no secret, signed URL token, prompt
          body, caller dialogue, or user filename fields
      - name: OperationContext
        shape: frozen dataclass
        fields:
          - release_id
          - worker_id
          - correlation_id
          - job_id?
          - attempt_id?
          - deadline
        validation: safe identifiers only; cancellation/deadline propagated to every
          adapter
    behavior:
      - story_id: prompt-authoring/story/compose-a-mode-correct-h3-prompt
        given: a base-mode prompt omits non_diegetic_music entirely
        when: composition runs
        then: composition fails naming the absent section, because the absent-value
          token is the only permitted way to express no music
      - story_id: prompt-authoring/story/compose-a-mode-correct-h3-prompt
        given: a full-reference prompt supplies its six sections out of order
        when: composition runs
        then: the composed model carries the fixed order and the reordering is not
          silently accepted
      - story_id: prompt-authoring/story/compose-a-mode-correct-h3-prompt
        given: a first-and-last-frame prompt declares an eight-second clip
        when: the alignment header is derived
        then: the closing keyframe aligns to the eight-second mark formatted to exactly
          two decimals
    error_handling:
      - condition: grammar_digest_mismatch
        error: PromptGrammarIntegrityError
        recovery: Refuse to load the tables and keep the prompt boundary unavailable
        retryable: false
      - condition: vocabulary_default_undeclared
        error: PromptGrammarDefinitionError
        recovery: Fail at import so a vocabulary can never omit the default it relies on
        retryable: false
    dependencies:
      required_slice_ids: []
      external:
        - Python standard library
        - pydantic
        - structlog
      inversion_of_control: All side effects are Protocol dependencies supplied by the
        capability composition root; tests use deterministic fakes.
    integration_points:
      consumes:
        - pinned grammar tables, product configuration, and injected platform
          ports
      provides:
        - Frozen vocabulary tables for camera motion type, amplitude, and speed,
          cut phrasing, retention relationship markers, and task-type prefixes,
          each with its declared default
        - A grammar revision identifier and content digest computed over the
          tables, verified at load
        - The published JSON Schema describing the structured H3 prompt for
          external callers
      documented_routes: []
      reference_documentation:
        - See prompt-authoring.source_documents for the pinned upstream grammar
          of record; do not restate the commit here.
    configuration:
      - name: LOG_LEVEL
        type: enum
        default: INFO
        secret: false
        validation: DEBUG|INFO|WARNING|ERROR
      - name: PROMPT_GRAMMAR_REVISION
        type: string
        default: h3-2026-08
        secret: false
        validation: must match a shipped revision whose table digest verifies at load
      - name: SCHEMA_VERSION
        type: string
        default: "1"
        secret: false
        validation: supported version only
    observability:
      events:
        - prompt-authoring.structured-prompt-contract.1.started
        - prompt-authoring.structured-prompt-contract.1.succeeded
        - prompt-authoring.structured-prompt-contract.1.failed
      required_fields:
        - event
        - release_id
        - worker_id
        - correlation_id
        - duration_ms
        - outcome
        - error_code?
        - prompt_mode?
        - grammar_revision?
        - job_id?
      forbidden_fields:
        - credentials
        - authorization headers
        - signed URL tokens
        - full prompts
        - composed prompt bodies
        - caller dialogue, lyrics, and on-screen text
        - user-supplied filenames
      logging_contract: Use structlog JSON. Emit state changes and rejections once at
        the owning boundary; a rejection names the field and the rule, never the
        offending text.
    security_constraints:
      - Caller-supplied dialogue, lyrics, and on-screen text are data, never
        grammar; they are contained at the render boundary and may not open a
        shot, a section, or a delimiter.
      - Validate at the boundary and pass typed values inward; never rebuild
        wire text from unchecked strings.
      - No global clients or ambient credentials; the prompt boundary receives
        the minimum dependency set.
      - Fail closed on grammar integrity, label resolution, containment, and
        digest uncertainty.
    test_scenarios:
      - id: S1-T01
        level: unit
        given: a base-mode prompt omits non_diegetic_music entirely
        when: composition runs
        then: composition fails naming the absent section, because the absent-value
          token is the only permitted way to express no music
      - id: S1-T02
        level: unit
        given: a full-reference prompt supplies its six sections out of order
        when: composition runs
        then: the composed model carries the fixed order and the reordering is not
          silently accepted
      - id: S1-T03
        level: unit
        given: a first-and-last-frame prompt declares an eight-second clip
        when: the alignment header is derived
        then: the closing keyframe aligns to the eight-second mark formatted to exactly
          two decimals
      - id: S1-TF
        level: failure_injection
        given: each declared error condition is injected at its owning boundary
        when: Pinned prompt grammar tables runs
        then: the recovery and retryability contract is observed and no wire text,
          event, or committed field carries the prompt body
    definition_of_done:
      - Public interfaces and models are type-checked with explicit exported
        return types.
      - Every behavior criterion has a discriminating automated test.
      - Every error condition has a tested recovery and retryability
        classification.
      - Structured events cover entry, success, failure, and material state
        transitions without sensitive fields.
      - Unit and adapter-contract tests pass; integration coverage exercises the
        linked stories.
      - No placeholder, TODO, mutable dependency reference, or console-only
        error remains.
    data_lifecycle:
      kind: exempt
      detail: Introduces no store. The tables are module-level frozen constants
        shipped in the pinned image and versioned in git; nothing writes to them
        at runtime.
    implementation_constraints:
      python: PEP 8, PEP 484, Google-style docstrings, async/await for I/O, and
        explicit exception wrapping with domain context.
      logging: structlog only for application events; the composed prompt body and
        caller text are structurally excluded from every event.
      bash: Any entrypoint or helper remains Bash 3.2 compatible and delegates policy
        to typed Python code.
      testing: pytest parametrization for scenario tables; fakes implement the same
        Protocols as production adapters, injected at the constructor.
