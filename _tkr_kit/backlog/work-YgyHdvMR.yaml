remedy: Land durable-delivery/feature/enforced-retention, slices 11-15. Slice 12
  (Backblaze lifecycle adapter) is the one that converts every declared period
  into an enforced one; slice 13 covers job.prompt, which no object-class prefix
  can reach.
detail: config/lifecycle.yaml declares periods for six object classes and is
  read by no code. delivery/lifecycle.py ships LifecyclePolicy plus a pure
  expired() predicate and no adapter. No Backblaze lifecycle rule is provisioned
  anywhere in src/ or scripts/. LifecyclePolicy is threaded through
  compose_durable_delivery as an unused field. Nothing deletes anything, so
  job.prompt, job.input_reference and job.output_video all persist in
  ca-east-006 indefinitely.
