rationale: Committed evidence must not present a derived value as an observed
  one. The contract reads provider version, but where the provider reports none
  the field carries a digest-derived stand-in, so the evidence is thinner than
  its own vocabulary claims. Still true after the long-haul hydration work
  touched this file. A reader auditing provenance cannot tell the substitution
  from a real provider fact, which is the property that makes the evidence worth
  keeping in the first place.
