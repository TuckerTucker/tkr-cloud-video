rationale: "A pinned workflow asset can carry the frontend export shape rather
  than the API shape, and the two are not interchangeable: the executor matches
  a dynamic input against option keys, so a nested object resolved to no option
  and the node ran without a required argument. Any pinned third-party graph
  needs its export shape verified at publication, because the failure surfaces
  at execution on a disposable worker."
