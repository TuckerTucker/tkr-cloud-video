rationale: Request defaults must be resolved from the model set the request
  names, never baked into the schema as static field defaults. The schema
  defaulted to 73 frames at 864x480 while the node declared 1344x768 and a
  trained range of roughly 124 to 362 frames, so the product shipped defaults
  outside the envelope it was pinned to. Now fixed — contracts.py resolves
  defaults through apply_trained_defaults and validates canvas, frame grid and
  range — and the lesson is what keeps a second model set from reintroducing it.
