rationale: "Each recovery cost a build, a deploy and a generation run, three
  times over, for information the process already held and discarded at a layer
  boundary. A remote worker whose logs are unreachable through the provider's
  API can only report what it returns, so the error's allowlisted context is the
  diagnosis. The rule earned here: carry what names the subject — the node, the
  exception class, a bounded message — and leave only what is unbounded, the
  traceback and free text that can quote a payload."
