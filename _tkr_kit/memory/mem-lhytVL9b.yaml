rationale: Object-store existence must be asked of head, never inferred from a
  read. B2 answers an absent object with empty content and success, so a
  read-based check reported a committed result that was never written. This is a
  property of the storage protocol, not of this codebase, and it silently
  converts a missing artifact into a passing assurance check wherever the same
  shortcut is taken.
