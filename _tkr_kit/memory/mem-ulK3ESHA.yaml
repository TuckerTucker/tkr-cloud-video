rationale: A pinned workflow asset must be the API export, not the frontend
  export. The executor matches a dynamic input against option keys, so a nested
  object from the frontend shape resolved to no option and the node ran without
  a required argument, failing at generation time rather than at pin time. Any
  asset pinned by digest should be validated against the shape its consumer
  parses, since the digest proves the bytes are unchanged and says nothing about
  whether they are the right bytes.
