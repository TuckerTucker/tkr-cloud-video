rationale: Existence in an object store must be asked of a head request, never
  inferred from a read. B2 answers an absent object with empty content and
  success, so a read-based check reported a committed result that was never
  written — a false success at the commit boundary, the worst place to have one.
  Generalizes to every object-store adapter this product adds.
