rationale: "Resolved, and the insight generalizes past this parameter. A bound
  that caps without flooring admits defaults outside the range the dependency
  was built for: width/height/frames were capped at MiniMax H3 native limits
  with floors of 256 and 5, so defaults of 864x480x73 sat below the trained
  canvas and frame floor while validating cleanly. The guard that should have
  caught it asserted the temporal grid and named itself \"executable by MiniMax
  H3\" — executable is not trained, and a test that checks the weaker property
  blesses the stronger claim in its own name. Two rules came out of it: read the
  pinned dependency's own declaration rather than inheriting a number, and where
  sub-range values are legitimate (a cheap smoke test), fix the silence rather
  than the legality by recording which axis falls short. Superseded the earlier
  deferral, which was correct while the remedy was unknown."
