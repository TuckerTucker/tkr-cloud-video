  title: "A pinned workflow asset carried a frontend export shape: the executor
    matches a dynamic input against option keys, so a nested object resolved to
    no option and the node ran without a required argument"
  status: resolved
  file: release-assets/minimax-h3-t2v/workflow-api.json
  session: first-validation
provenance:
  sourceSessionId: first-validation
  sourceHash: 4e3bcefffb82fc41c5a00b66249c89ed86437afa72802a6a12bf934c37e7b531
