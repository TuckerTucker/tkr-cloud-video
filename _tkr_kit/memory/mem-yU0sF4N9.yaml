rationale: A reviewed, digest-pinned asset was still wrong, and pinning made it
  wrong reproducibly. The workflow was captured in the shape a frontend exports
  rather than the shape the API executor consumes, and the executor drops an
  input it cannot resolve instead of rejecting it, so the failure surfaced as a
  missing argument inside the node rather than as a validation error. Worth
  keeping because provenance guarantees an asset is unchanged, never that it was
  right, and because startup validation checked node classes and model files
  without ever exercising the graph.
