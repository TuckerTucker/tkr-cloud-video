rationale: A failure must carry its subject across every layer it crosses. The
  failing node, exception class and message existed at each boundary and were
  dropped three times, and each recovery cost a build-and-deploy cycle because
  the only way to learn what failed was to redeploy with more logging. The cost
  of discarding failure context is paid in deploy cycles, not in log lines.
