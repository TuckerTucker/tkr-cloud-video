  - name: engineering-foundation
    layer: infra
    status: done
    display_name: Engineering Foundation
    description: Establishes the reproducible Python project, shared runtime
      contracts, local and CI quality gates, and live execution boundaries
      required before product-domain implementation begins.
    depends_on: []
    optional_depends_on: []
    provides_to:
      - security-foundation
      - artifact-foundation
      - worker-runtime
      - job-execution
      - durable-delivery
      - operations-and-scale
      - prompt-authoring
      - operator-console
      - reference-generation
    scope_in:
      - Python 3.11+ src-layout packaging with committed pyproject metadata, uv
        lockfile, typed package marker, documented developer commands, and
        deterministic runtime/development dependency groups.
      - Shared IoC-friendly runtime contracts for operation context, typed
        errors, validated settings sources, clocks, structured structlog events,
        correlation, and structural redaction.
      - One local and CI quality contract covering Ruff formatting/linting,
        strict mypy checks, pytest with coverage, package/import smoke tests,
        lockfile drift, and Bash 3.2-compatible orchestration.
      - A diagnostic package entrypoint that verifies configuration and
        dependency wiring without contacting cloud providers or requiring
        secrets.
      - Execution-boundary reconciliation so later slices own live directories
        while retaining exact planned file targets.
    scope_out:
      - Backblaze, RunPod, ComfyUI, ffprobe, or other provider integrations.
      - Product-domain credential, artifact, job, delivery, or operations
        behavior.
      - Container-image construction and deployment automation beyond exercising
        the package contract.
      - Provisioning cloud infrastructure or storing production secrets.
    acceptance_criteria:
      - A fresh checkout on a supported Python version reproduces the
        environment with uv sync --frozen from the committed lockfile.
      - The package imports from the src layout and exposes no provider client
        or ambient global dependency.
      - Ruff, strict mypy, pytest, coverage, lockfile verification, and package
        smoke checks run through one Bash 3.2-compatible command locally and in
        CI.
      - structlog emits allowlisted JSON with correlation context while secrets,
        authorization headers, signed URLs, prompts, and user filenames are
        structurally excluded.
      - The diagnostic entrypoint succeeds without cloud credentials and reports
        typed, actionable failures for invalid local configuration.
      - Dependent product slices remain blocked until this capability's test
        slice is done and their declared capability prerequisites are satisfied.
    paths:
      - pyproject.toml
      - uv.lock
      - README.md
      - src/tkr_cloud_video/**
      - tests/engineering_foundation/**
      - .github/workflows/**
      - scripts/**
  - name: prompt-authoring
    layer: domain
    status: done
    display_name: Prompt Authoring
    description: "Owns the MiniMax H3 prompt grammar as a typed, versioned contract:
      structured composition, pre-flight structural validation, deterministic
      rendering to the exact wire text, and prompt-form provenance, so a
      malformed prompt is rejected before GPU spend and a committed result
      records the grammar revision it was generated under."
    depends_on:
      - engineering-foundation
      - security-foundation
      - job-execution
    optional_depends_on: []
    provides_to:
      - operator-console
      - reference-generation
    scope_in:
      - Typed models for the H3 base-mode prompt
        (integrated_multimodal_description, overall_soundscape,
        non_diegetic_music) and the full-reference prompt (subject_definitions,
        summary, retention_analysis, detailed_description, overall_soundscape,
        non_diegetic_music) with the field order each mode fixes.
      - Mode-specific keyframe alignment headers for T2VA, I2VA, FL2VA, and
        L2VA, with two-decimal timing bound to the requested clip duration.
      - Controlled vocabularies with declared defaults for camera motion type,
        amplitude, and speed, cut phrasing, retention relationship markers, and
        task-type prefixes, so an omitted modifier is omitted rather than
        invented.
      - "Structural validation before submission: monotonic shot numbering, cut
        times inside the requested duration, resolved reference labels, balanced
        dialogue and transition delimiters, and speaker-identifier continuity
        across shots."
      - Deterministic rendering to the exact wire text, a stable prompt digest,
        and a pinned grammar revision carried into reproducibility metadata.
      - Containment of untrusted caller text so dialogue, lyrics, and on-screen
        text are preserved verbatim yet cannot inject grammar tokens, shot
        headers, or field names into the rendered prompt.
    scope_out:
      - An end-user prompt editor, gallery, or any interactive authoring
        surface; composition is reachable headlessly in a single call.
      - "Creative quality judgement: scoring, rewriting for aesthetics, or
        recommending content."
      - Prompt grammars for video models other than MiniMax H3; portability is
        preserved through the mode discriminator and vocabulary tables, not
        through a second grammar.
      - Model-side prompt adherence. This capability validates form and never
        predicts render fidelity.
    acceptance_criteria:
      - A structurally invalid prompt is rejected with field-scoped typed errors
        before any input transfer or GPU allocation.
      - Rendering the same structured prompt twice produces byte-identical wire
        text and the same prompt digest.
      - Caller-supplied dialogue, lyrics, and on-screen text survive rendering
        byte for byte and cannot introduce grammar tokens, shot headers, or
        field names.
      - Every accepted prompt records the pinned grammar revision it validated
        against, and a revision change is detectable without re-reading the
        prompt.
      - The validator reports which checks it did not run for the submitted
        mode, so a passing result never implies coverage it did not have.
      - No validation error, log event, or result field carries the composed
        prompt body or caller dialogue.
    paths:
      - docs/prompting/**
    source_documents:
      - https://github.com/MiniMax-AI/MiniMax-H3 @
        6da473b48daf91e5aebfb56451f8a0b116348df5 — skills/h3-prompt-writing/
        (SKILL.md, references/base-en.txt, references/ref-en.txt); the grammar
        of record for this capability, pinned by upstream commit.
    evidence:
      kind: commit
      ref: 3abb15cb91703e2f4068971d141f42cff5d9e858
  - name: operator-console
    layer: service
    status: in_progress
    display_name: Operator Console
    description: 'A loopback web surface that submits a generation and plays back what
      it committed. It exists because the two things the Serverless endpoint cannot
      do for a caller are the two it most needs: refuse a defective request before
      a cold start, and return a video. The handler answers with references and never
      media bytes, and a run''s status reports that the worker answered rather than
      that anything was generated.'
    depends_on:
      - engineering-foundation
      - security-foundation
      - job-execution
      - durable-delivery
      - prompt-authoring
      - operations-and-scale
    optional_depends_on: []
    provides_to:
      - reference-generation
    scope_in:
      - A loopback HTTP surface holding the Serverless bearer credential and the delivery-read
        credential so a browser never does, bound to loopback in its settings rather
        than in its launch command.
      - Local intake preflight running the worker's own two validation steps in the
        worker's order, so a contract or prompt defect is refused in milliseconds rather
        than after model hydration.
      - Form constraints served from the pinned trained-envelope and grammar tables,
        so a newly registered model set or corrected bound reaches the surface by being
        registered.
      - Asynchronous submission, bounded observation of a run to a terminal state,
        cancellation, and separation of the provider's status from the handler's own
        accept-or-refuse response.
      - Session-derived job identity and authorization, and short-lived signed playback
        of a committed video through the existing delivery services.
    scope_out:
      - Any non-loopback deployment. The surface authenticates nothing because the
        operating system has already answered who the caller is; publishing it needs
        authentication, per-principal identity and a durable registry, and is a separate
        capability rather than a configuration change here.
      - Multi-tenant isolation. One console serves one principal, so every job it derived
        is reachable by whoever reaches the port.
      - Uploading a reference or keyframe image, owned by reference-generation.
      - Changing the request contract, the prompt grammar, the workflow graph, or any
        delivery guarantee. The console composes existing services and adds no generation
        behavior of its own.
      - Durable job history. The registry is in memory for the life of the process.
    acceptance_criteria:
      - A request the worker would refuse is refused locally, with the same code and
        the same field-scoped defects, before it reaches the endpoint.
      - The local refusal and the worker's refusal agree decision for decision across
        the request matrix, and disagreement fails a test rather than surfacing as
        a request the console accepted and the endpoint rejected.
      - No response the browser receives carries the Serverless credential, either
        delivery credential, or a signed URL for anything but the committed video.
      - A committed video is playable through a link that is reauthorized at issue,
        bounded by the delivery policy's maximum lifetime, and absent from every log
        and error context.
      - The surface composes no uploader, committer, reconciler or erasure path, so
        it cannot write to or delete from the delivery bucket.
      - A console whose principal differs from the endpoint's is detected and named,
        rather than reporting every successful generation as never committed.
    paths:
      - src/tkr_cloud_video/console/**
      - tests/console/**
      - docs/models/operator-console.md
    execution_gate:
      kind: manual_cross_capability
      prerequisite_capabilities:
        - engineering-foundation
        - security-foundation
        - artifact-foundation
        - worker-runtime
        - job-execution
        - durable-delivery
        - prompt-authoring
        - operations-and-scale
      rule: Do not transition the capability's entry slice from blocked to planned
        until every prerequisite capability test slice is done.
    resume_condition: The capability closes when its implementing commit reaches the
      default branch. Until then its slices carry commit evidence for work that exists
      on an open pull request, which is why the capability is in_progress while every
      slice beneath it is done.
    evidence:
      kind: commit
      ref: 954dd8c54e68900805b6ed78cf039bdca11e3632
  - name: reference-generation
    layer: service
    status: planned
    display_name: Reference-Conditioned Generation
    description: 'Turns the reference-to-video mode from a contract the request schema
      already accepts into a path that can execute. The request type, the input stager,
      the Ref2VA prompt grammar, the input_0..input_3 binding allowlist and the inputs/
      retention class all shipped with their owning capabilities; what is absent is
      a published workflow whose graph carries reference inputs, a registered envelope
      for the model set that workflow belongs to, an authorized way for a caller''s
      image to reach inputs/, and the assessments that must precede any worker outside
      Quebec reading one. Audio is the same story one step further out: the grammar
      defines audio labels, an audio-specific retention marker set and two audio task
      types, while the intake path cannot describe a stream that has no dimensions
      at all.'
    depends_on:
      - engineering-foundation
      - security-foundation
      - artifact-foundation
      - job-execution
      - durable-delivery
      - prompt-authoring
      - operator-console
    optional_depends_on: []
    provides_to: []
    scope_in:
      - A published ComfyUI API workflow whose reference-conditioning node inputs exist
        in the graph, because the binder mutates declared inputs and refuses a binding
        whose input name is absent.
      - A binding map drawn from the existing input_0..input_3 allowlist, so the release
        binding vocabulary is unchanged.
      - A trained-envelope registration for the model set the reference workflow belongs
        to, with the envelope digest restated, so a reference request resolves its
        defaults instead of being refused as unregistered.
      - A reviewer license approval bound to the new manifest digest, because republishing
        a workflow changes the digest the current approval binds.
      - Dated assessments covering reference images and supplied audio, each completed
        before material of that kind is read by a worker.
      - A principal-scoped inputs namespace and a write credential narrow enough that
        input authorization is structural rather than a lookup.
      - An intake contract able to describe an audio stream, which has neither width
        nor height, without weakening the dimension requirement images and videos carry.
    scope_out:
      - Image-to-video. It is a sibling mode that reuses this capability's intake and
        release slices but conditions on keyframes rather than references, so it needs
        a workflow revision of its own and is not delivered by riding along here.
      - Changing the generation request contract or the prompt grammar. ReferenceToVideoRequest
        and the Ref2VA sections are done and terminal.
      - Retention enforcement for uploaded inputs, owned by durable-delivery/feature/enforced-retention.
      - Model selection, fine-tuning, or judging whether a reference was honoured.
      - Speaker identification, consent capture, or transcription of supplied audio.
      - Publishing the console beyond loopback, which uploading makes more tempting
        and no less out of scope.
    acceptance_criteria:
      - A reference-to-video request naming one to four authorized objects binds each
        into the pinned workflow and reaches a committed result.
      - No reference image or audio object is read by a worker before a dated assessment
        covering material of that kind records its sensitivity, purpose, territories
        and protection measures.
      - The published reference manifest's digest is covered by an unexpired reviewer
        approval, and an uncovered digest fails the release gate rather than the run.
      - A reference request naming a model set with no registered envelope is refused
        at intake, not given another model set's numbers.
      - No credential gains write access outside the principal-scoped inputs prefix,
        and no worker process role is handed the input-writing credential.
      - A reference object a principal does not own is refused before download, and
        the refusal is indistinguishable from the object being absent.
      - Admitting a medium with no dimensions does not relax the dimension requirement
        for the media that have them, and an absent measurement is never represented
        as a zero.
    paths:
      - release-assets/**
      - docs/assurance/**
      - src/tkr_cloud_video/**
      - tests/**
    execution_gate:
      kind: manual_cross_capability
      prerequisite_capabilities:
        - engineering-foundation
        - security-foundation
        - artifact-foundation
        - worker-runtime
        - job-execution
        - durable-delivery
        - prompt-authoring
        - operations-and-scale
        - operator-console
      rule: Do not transition the capability's entry slice from blocked to planned
        until every prerequisite capability test slice is done.
    deferred_reason: Reference images and supplied audio are the material the compliance
